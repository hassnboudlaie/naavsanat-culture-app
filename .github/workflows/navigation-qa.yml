name: Classroom QA
on:
  push:
    branches: [main]
    paths:
      - 'next/**'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/navigation-qa.yml'
  workflow_dispatch:
jobs:
  classroom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test this commit before relying on deployed state
        run: node tests/classroom-qa.cjs
        env:
          QA_OUTPUT: qa-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classroom-qa
          path: qa-artifacts/
