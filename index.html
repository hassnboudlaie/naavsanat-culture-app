function footer(){return '<footer class="footer"><div><b>شرکت بین‌المللی ناوصنعت مس</b><br>با هم می‌آموزیم؛ مسئولانه‌تر کار می‌کنیم.</div><div>مدرس و تسهیلگر: دکتر حسن بودلایی</div></footer>'}
function identityCard(route,icon,title,desc){return '<button class="identity-card" onclick="goRoute(\''+route+'\')"><span class="track-icon" aria-hidden="true">'+roleIcon(route)+'</span><h3>'+title+'</h3><p>'+desc+'</p><span class="enter"><span>ورود به مسیر شما</span><span aria-hidden="true">←</span></span></button>'}
function roleIcon(role){var path=role==='managers'?'<path d="M7 19v-6m5 6V9m5 10V5M4 20h16"/>':role==='hq'?'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M9 5V3h6v2M4 11h16M10 11v3h4v-3"/>':'<path d="M5 10a7 7 0 0 1 14 0M4 10h16v3H4zM8 10V5m8 5V5M6 16c2 4 10 4 12 0"/>';return '<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+path+'</svg>'}
function landing(){return '<div class="fade home-v4"><section class="welcome-hero"><div class="welcome-photo" role="img" aria-label="تصویر فعالیت و همکاری کارکنان در صفحه معرفی ناوصنعت مس"></div><div class="welcome-copy"><div class="welcome-brand"><div class="welcome-logo"><img src="'+LOGO_DATA+'" alt="نشان شرکت بین‌المللی ناوصنعت مس" width="119" height="119"></div><div><span class="welcome-kicker">شرکت بین‌المللی ناوصنعت مس</span><span class="welcome-label">فضای یادگیری و گفت‌وگوی حرفه‌ای</span></div></div><h1>رفتار سازمانی<br><span>و فرهنگ سازمانی</span></h1><p class="welcome-description">از تجربه‌های روزمره کار شروع می‌کنیم؛ با گفت‌وگو، یادگیری و تمرین، همکاری بهتری می‌سازیم.</p><div class="welcome-values"><span>اعتماد و احترام</span><span>همکاری مؤثر</span><span>مسئولیت‌پذیری</span></div><p class="welcome-instructor">مدرس و تسهیلگر: <b>دکتر حسن بودلایی</b></p></div></section><section class="role-entry" aria-labelledby="role-question"><div class="identity-question"><span class="entry-label">از اینجا شروع کنید</span><h2 id="role-question">شما در ناوصنعت کجا هستید؟</h2><p>نقش خود را انتخاب کنید تا وارد محتوای ویژه خودتان شوید.</p></div><div class="identity-grid">'+identityCard('hq','',ROLES.hq.title,'گفت‌وگوی روشن، همکاری بین واحدها و پیگیری مسئولانه.')+identityCard('managers','',ROLES.managers.title,'رهبری رفتار، تصمیم منصفانه و ساختن اعتماد در تیم.')+identityCard('operations','',ROLES.operations.title,'احترام، همکاری و مسئولیت‌پذیری در کار روزمره.')+'</div></section><div class="home-note"><span>یادگیری از تجربه، تمرین در گفت‌وگو، تغییر در رفتار</span><button onclick="goRoute(\'context\')">درباره این برنامه ←</button></div>'+footer()+'</div>'}
function roleCaseList(role){return '<section class="role-cases"><div class="section-head"><div><h2>کیس‌های ویژه '+ROLES[role].title+'</h2><p>از هر کیس که به تجربه شما نزدیک‌تر است شروع کنید.</p></div><span class="section-tag">'+fa(caseCount(role))+' از ۱۵ مرور شده</span></div><p class="scenario-note">روایت‌ها برای یادگیری از مسائل ناوصنعت تدوین شده‌اند؛ تحلیل علت‌ها با شنیدن تجربه و بررسی شواهد شرکت تکمیل می‌شود.</p>'+GROUPS.map(function(g,i){return '<section class="case-category"><div class="case-category-head"><h3>'+g+'</h3><span>۵ کیس</span></div>'+smallCaseCards([i*5+1,i*5+2,i*5+3,i*5+4,i*5+5],role)+'</section>'}).join('')+'</section>'}
function trackPage(type){if(!ROLES[type]||type==='operations')return operationsPage();var data=type==='managers'?managers:hq;chooseRole(type);var visited=getVisited();return '<div class="fade"><section class="page-hero"><div class="breadcrumb"><button onclick="goRoute(\'home\')">خانه</button><span>←</span><span>'+ROLES[type].title+'</span></div><h1>مسیر '+ROLES[type].title+'</h1><p>'+ROLES[type].focus+'؛ با نگاه رفتار سازمانی و فرهنگ سازمانی.</p><div class="page-meta"><span>محتوای ویژه نقش شما</span><span>۱۵ کیس</span><span>۶ بخش برای هر کیس</span></div></section>'+(type==='managers'?'<section class="focus-session"><div><h2>شروع از جلسه اول · سازمان حرفه‌ای</h2><p>کیس‌های ۱ و ۱۰ با گفت‌وگوهای طبیعی، انتخاب واکنش و تحلیل پیامد</p></div><button onclick="goRoute(\'managers-0\')">ورود به جلسه اول ←</button></section>':'')+roleCaseList(type)+'<details class="session-planner"><summary>جلسات پیشنهادی مسیر شما</summary><p>اگر با برنامه مدرس پیش می‌روید، کیس‌های هر جلسه را از اینجا باز کنید. جلسه‌ها مستقل‌اند.</p><div class="session-grid">'+data.map(function(s,i){return '<article class="session-card"><div class="session-top"><div class="session-no">'+fa(i+1)+'</div><span class="status">'+(visited[type+'-'+i]?'مرور شده':fa(sessionCases[type][i].length)+' کیس')+'</span></div><h3>'+esc(s.t)+'</h3><p>'+esc(s.d)+'</p><button class="session-link" onclick="goRoute(\''+type+'-'+i+'\')">ورود به جلسه ←</button></article>'}).join('')+'</div></details>'+footer()+'</div>'}
function operationsPage(){chooseRole('operations');var titles=['آشنایی و رفتار حرفه‌ای','ایمنی و بیان نگرانی','تعهد و فشار کاری','همکاری و گفت‌وگو','ورود، اختیار و تحویل کار'];return '<div class="fade"><section class="page-hero"><div class="breadcrumb"><button onclick="goRoute(\'home\')">خانه</button><span>←</span><span>کارکنان عملیاتی</span></div><h1>مسیر کارکنان عملیاتی</h1><p>از موقعیت‌های آشنای شیفت و محل کار، به احترام، همکاری و مسئولیت‌پذیری بیشتر برسیم.</p><div class="page-meta"><span>بیان ساده و کاربردی</span><span>۱۵ کیس</span><span>امکان گفت‌وگوی شفاهی</span></div></section>'+roleCaseList('operations')+'<details class="session-planner"><summary>راهنمای اجرای کارگاه و تمرین شفاهی</summary><p>مدرس موقعیت را می‌خواند؛ افراد ابتدا می‌گویند چه می‌کنند. سپس علت رفتاری و جمله مناسب را تمرین می‌کنند. برای هر بخش، یک کیس را عمیق‌تر بررسی کنید و بقیه را برای مرور نگه دارید.</p><ol>'+opsCaseBlocks.map(function(ids,i){return '<li><b>'+titles[i]+'</b>؛ کیس‌های '+ids.map(fa).join('، ')+'</li>'}).join('')+'</ol><p>در پایان، هر نفر یک رفتار را انتخاب کند و بگوید در کدام موقعیت آن را تمرین می‌کند.</p></details>'+footer()+'</div>'}
function casesPage(){return selectedRole()==='operations'?operationsPage():trackPage(selectedRole())}
function paragraph(x){return Array.isArray(x)?'<ul class="analysis-list">'+x.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul>':'<p>'+esc(x)+'</p>'}
function theoryCard(c){var t=c.theory;return '<section class="theory-card"><span class="theory-label">نگاه علمی به این مسئله</span><h3>'+esc(t.name)+'</h3>'+paragraph(t.explanation)+'<details><summary>منبع و حدود کاربرد</summary>'+[t.source,t.secondary].filter(Boolean).map(function(k){return '<a class="source-link" href="'+SOURCES[k].url+'" target="_blank" rel="noopener noreferrer">'+SOURCES[k].title+' ↗</a>'}).join('<br>')+'<p>این چارچوب برای فهم مسئله به کار رفته است؛ وجود یک علت مشخص در ناوصنعت، به بررسی شواهد همان موقعیت نیاز دارد.</p></details></section>'}
function caseBody(c,role,step){var v=c.variants[role];if(step===0)return '<div class="scenario-tag">موقعیت آموزشی از محیط کار ناوصنعت</div>'+paragraph(v.problem)+decisionLab(c,role)+'<div class="reflect-prompt"><b>مسئله رفتاری را پیدا کنیم</b>در این موقعیت چه رفتاری دیده می‌شود؟ چه اثری بر اعتماد، همکاری یا مسئولیت‌پذیری دارد؟</div>';if(step===1)return '<h3 class="section-subtitle">چه چیزی می‌تواند پشت این رفتار باشد؟</h3>'+paragraph(v.analysis)+theoryCard(c)+'<div class="evidence-prompt"><b>برای تشخیص دقیق‌تر چه بپرسیم؟</b>'+paragraph(c.evidence)+'</div><details><summary>راهنمای مدرس برای ریشه‌یابی</summary><ul><li>رفتار مشاهده‌شده را از حدس درباره شخصیت و نیت فرد جدا کنید.</li><li>باور فرد، واکنش مدیر، فشار گروه و امکانات واقعی کار را هم‌زمان ببینید.</li><li>یک توضیح جایگزین را بررسی کنید؛ هر مشکل را فقط به نگرش یا اخلاق فرد نسبت ندهید.</li></ul></details>';if(step===2)return '<blockquote>'+esc(v.lesson)+'</blockquote><div class="reflect-prompt"><b>از دانستن به رفتار برسیم</b>اگر این درس را جدی بگیریم، در گفت‌وگوی بعدی چه چیزی را متفاوت انجام می‌دهیم؟</div>';if(step===3&&role==='managers')return '<div class="key-takeaway">'+esc(v.note)+'</div>'+managerRolePlay(c,v);if(step===3)return '<div class="key-takeaway">'+esc(v.note)+'</div><section class="dialogue-card"><h3>نمونه جمله در گفت‌وگو</h3><p>«'+esc(v.dialogue)+'»</p></section><p>با همکارتان تمرین کنید؛ جمله را با لحن طبیعی خودتان بگویید و اثر آن را از او بپرسید.</p>';if(step===4)return '<p>این رفتارها را متناسب با نقش خود تمرین کنید:</p><ol class="action-list">'+v.solution.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol><details><summary>تمرین کوتاه و پیگیری</summary><ol><li>یک رفتار از فهرست را انتخاب کنید.</li><li>در یک موقعیت مشخص طی هفته یا شیفت بعد تمرین کنید.</li><li>از طرف مقابل بپرسید چه اثری داشته است.</li><li>در گفت‌وگوی بعدی، تجربه و اصلاح لازم را مرور کنید.</li></ol></details>'+actionForm(c.id,role);return '<ol class="question-list">'+v.questions.map(function(q){return '<li>'+esc(q)+'</li>'}).join('')+'</ol><details><summary>پیام مدرس و نکات گفت‌وگو</summary>'+paragraph(v.lesson)+'<ul><li>ابتدا فرصت فکرکردن فردی بدهید؛ بعد تجربه‌ها را بشنوید.</li><li>درباره رفتار و اثر آن حرف بزنید؛ از نام‌بردن و برچسب‌زدن به اشخاص پرهیز کنید.</li><li>بپرسید: «سهم من چیست؟ چه چیزی در اختیار من است؟ قدم بعدی من چیست؟»</li><li>بحث را با یک رفتار قابل تمرین و یک زمان پیگیری تمام کنید.</li></ul></details>'+discussionForm(c.id,role)}
function casePage(gi,ci,role,step){var id=gi*5+ci+1,c=CASES[id-1];if(!c||gi<0||gi>2||ci<0||ci>4)return casesPage();role=ROLES[role]?role:selectedRole();step=Number.isInteger(step)&&step>=0&&step<6?step:0;chooseRole(role);var done=isDone(id,role);return '<div class="fade"><section class="page-hero case-heading"><div class="breadcrumb"><button onclick="goRoute(\''+role+'\')">'+ROLES[role].title+'</button><span>←</span><span>کیس '+fa(id)+'</span></div><h1>'+esc(c.title)+'</h1><p>'+esc(c.concept)+'</p><div class="page-meta"><span>'+ROLES[role].title+'</span><span>بخش '+fa(step+1)+' از ۶</span></div></section><div class="case-workspace"><nav class="case-step-nav" aria-label="بخش‌های کیس">'+STEPS.map(function(s,i){return '<button class="'+(i===step?'active':'')+'" '+(i===step?'aria-current="step"':'')+' onclick="goRoute(\''+caseRoute(id,role,i)+'\')"><span class="step-number">'+fa(i+1)+'</span><span>'+s+'</span></button>'}).join('')+'</nav><article class="case-reading" id="case-reading"><div class="reading-header"><span class="section-tag">'+fa(step+1)+' / ۶</span><span>ویژه '+ROLES[role].title+'</span></div><h2>'+STEPS[step]+'</h2>'+caseBody(c,role,step)+'<div class="step-pagination">'+(step>0?'<button class="prevnext" onclick="goRoute(\''+caseRoute(id,role,step-1)+'\')">→ بخش قبل</button>':'<span></span>')+(step<5?'<button class="next-step" onclick="goRoute(\''+caseRoute(id,role,step+1)+'\')">بخش بعد ←</button>':'<button class="next-step" onclick="toggleCaseDone('+id+',\''+role+'\')">'+(done?'لغو علامت مرور':'کیس را مرور کردم ✓')+'</button>')+'</div></article></div><div class="case-nav-row"><button class="prevnext" '+(id===1?'disabled':'onclick="openCase('+(id-1)+',\''+role+'\')"')+'>→ کیس قبل</button><button class="allcases" onclick="goRoute(\''+role+'\')">بازگشت به مسیر شما</button><button class="prevnext" '+(id===15?'disabled':'onclick="openCase('+(id+1)+',\''+role+'\')"')+'>کیس بعد ←</button></div><details class="export-panel"><summary>یادداشت‌ها و اقدام‌های من</summary><p>یادداشت‌ها در همین مرورگر می‌مانند. برای نگهداری نسخه شخصی، خروجی بگیرید.</p><button class="btn btn-copper" onclick="exportNotes(\''+role+'\')">دریافت یادداشت‌های این مسیر</button><button class="btn btn-outline" onclick="printCase('+id+',\''+role+'\')">چاپ شش بخش این کیس</button></details>'+footer()+'</div>'}
function printCase(id,role){var c=CASES[id-1],v=c.variants[role],area=document.getElementById('print-area');area.innerHTML='<h1>'+esc(c.title)+'</h1><p>کیس '+fa(id)+' | '+ROLES[role].title+' | مدرس: دکتر حسن بودلایی</p><p>موقعیت آموزشی؛ تحلیل علت‌ها با شواهد شرکت تکمیل می‌شود.</p>'+STEPS.map(function(s,i){var body=i===0?v.problem:i===1?v.analysis:i===2?v.lesson:i===3?v.note:null;return '<section><h2>'+fa(i+1)+'. '+s+'</h2>'+(body?paragraph(body):'<ol>'+(i===4?v.solution:v.questions).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol>')+(i===1?'<h3>'+esc(c.theory.name)+'</h3>'+paragraph(c.theory.explanation)+paragraph('منبع: '+SOURCES[c.theory.source].title):'')+(i===3?paragraph('نمونه جمله: '+v.dialogue):'')+'</section>'}).join('');window.print()}
function contextPage(){return '<div class="fade"><section class="page-hero"><div class="breadcrumb"><button onclick="goRoute(\'home\')">خانه</button><span>←</span><span>درباره برنامه</span></div><h1>از تجربه کار تا فرهنگ مشترک</h1><p>برنامه یادگیری رفتار سازمانی و فرهنگ سازمانی شرکت بین‌المللی ناوصنعت مس</p></section><section class="content-card"><h2>زمینه واقعی، نگاه رفتاری</h2><p>ناوصنعت در بستر حمل‌ونقل و خدمات مرتبط با صنعت مس فعالیت می‌کند. پراکندگی محل‌های کار و ارتباط ستاد با میدان، اعتماد، گفت‌وگوی روشن، همکاری و مسئولیت‌پذیری را به موضوع‌های مهم این برنامه تبدیل می‌کند.</p><p>در اینجا درباره نگرش، انگیزه، هنجار گروه، عدالت، نقش‌ها و رفتار مدیران گفت‌وگو می‌کنیم. جزئیات عملیات، زمینه مثال‌اند؛ هدف برنامه، تقویت رفتار حرفه‌ای و یادگیری مشترک است.</p><a class="source-link" href="https://scico.ir/شرکت-های-تابعه/شرکت-بین-المللی-ناو-صنعت/" target="_blank" rel="noopener noreferrer">معرفی شرکت در هلدینگ مس سرچشمه ↗</a></section><section class="content-card context-section"><h2>چگونه از این برنامه استفاده کنیم؟</h2><ol><li>از خانه، مسیر مرتبط با نقش خود را انتخاب کنید.</li><li>یک کیس نزدیک به تجربه کاری خود باز کنید.</li><li>صورت مسئله، تحلیل، درس، نکته، اقدام و پرسش‌ها را مرور کنید.</li><li>نمونه جمله را با همکارتان تمرین و یک رفتار را برای ادامه انتخاب کنید.</li><li>در شیفت یا جلسه بعد، اثر رفتار تازه را مرور کنید.</li></ol></section><section class="content-card context-section"><h2>منابع علمی</h2><p>مفاهیم زیر به زبان ساده برای فهم مسئله به کار رفته‌اند. پیشنهادهای رفتاری و نمونه گفت‌وگوها، کاربرد آموزشی تدوین‌شده برای این برنامه‌اند و نقل‌قول از پژوهشگران نیستند.</p><ul class="sources-list">'+Object.keys(SOURCES).map(function(k){return '<li><a class="source-link" href="'+SOURCES[k].url+'" target="_blank" rel="noopener noreferrer">'+SOURCES[k].title+' ↗</a></li>'}).join('')+'</ul></section><section class="content-card context-section"><h2>مبنای طراحی</h2><ul><li>محورهای پانزده‌گانه اعلام‌شده توسط مدرس.</li><li>اسناد نشست توسعه سازمان و پیشنهاد برنامه رفتار و فرهنگ ناوصنعت.</li><li>زمینه صنعت مس، رابطه ستاد و محل‌های اجرا و تجربه کارکنان عملیاتی.</li></ul><p>روایت‌ها برای آموزش بازنویسی شده‌اند. علت‌های پیشنهادی باید با شنیدن دیدگاه افراد و شواهد همان موقعیت بررسی شوند. نام و تعداد محل‌های فعال یا مسیر برون‌مرزی معین، بدون تأیید به شرکت نسبت داده نشده است.</p><p>تصمیم‌های فنی و ایمنی تابع مسئول صلاحیت‌دار و رویه مصوب محل‌اند. یادداشت‌های این نسخه فقط در مرورگر کاربر ذخیره می‌شوند.</p><details><summary>منبع نشان و تصویر شرکت</summary><p><a class="source-link" href="https://jobvision.ir/companies/131825/" target="_blank" rel="noopener noreferrer">صفحه معرفی شرکت بین‌المللی ناوصنعت مس در جاب‌ویژن ↗</a></p></details></section>'+footer()+'</div>'}
function render(){var route=(location.hash||'#home').slice(1),html;document.getElementById('announcement').hidden=true;if(route==='home'||!route)html=landing();else if(route==='managers'||route==='hq')html=trackPage(route);else if(route==='operations')html=operationsPage();else if(route==='cases')html=casesPage();else if(route==='context')html=contextPage();else{var cm=route.match(/^case-(\d+)-(\d+)(?:\/(hq|managers|operations)(?:\/(\d+))?)?$/),m=route.match(/^(managers|hq)-(\d+)$/);html=cm?casePage(Number(cm[1]),Number(cm[2]),cm[3],Number(cm[4]||0)):m?sessionPage(m[1],Number(m[2])):landing()}document.getElementById('app').innerHTML=html;var currentRole=route==='cases'?selectedRole():((route.match(/^case-\d+-\d+\/(hq|managers|operations)/)||[])[1]||((route.match(/^(hq|managers|operations)(?:-|$)/)||[])[1]));if(route.indexOf('case-')===0&&!currentRole)currentRole=selectedRole();document.querySelectorAll('[data-route]').forEach(function(b){var r=b.getAttribute('data-route'),active=route===r||currentRole===r;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});var h=document.querySelector('main h1');document.title=(h?h.textContent+' | ':'')+'ناوصنعت مس';if(h){h.tabIndex=-1;h.focus({preventScroll:true})}window.scrollTo(0,0)}

window.addEventListener("hashchange",render);
render();

</script>
