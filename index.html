<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#082d36">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>مدیریت رفتار سازمانی و فرهنگ | ناوصنعت مس</title>
<style>
:root{
  --navy:#082d36;--navy2:#0f4552;--navy3:#176070;
  --copper:#b76538;--copper2:#d78b61;--copper3:#8e472b;
  --paper:#f3f4ef;--warm:#fbfaf7;--card:#ffffff;--ink:#173139;--muted:#718087;
  --line:#dfe5e2;--soft:#edf2ef;--soft-copper:#f7ebe4;--success:#2e7659;
  --shadow:0 18px 48px rgba(8,45,54,.10);--shadow-sm:0 9px 24px rgba(8,45,54,.07);
  --radius:26px;--radius-sm:17px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:
radial-gradient(circle at 10% 0%,rgba(183,101,56,.10),transparent 27%),
linear-gradient(180deg,#f7f8f5 0%,var(--paper) 100%);
color:var(--ink);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.85;-webkit-font-smoothing:antialiased}
button,a{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid rgba(215,139,97,.42);outline-offset:3px}
.topbar{position:sticky;top:0;z-index:50;background:rgba(247,248,245,.91);backdrop-filter:blur(16px);border-bottom:1px solid rgba(223,229,226,.85)}
.topbar-in{max-width:1180px;margin:auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{width:44px;height:44px;flex:0 0 44px;border-radius:13px;background:linear-gradient(145deg,#d68052,#8e472b);position:relative;box-shadow:0 10px 20px rgba(183,101,56,.22);overflow:hidden}
.brand-mark:before,.brand-mark:after{content:"";position:absolute;background:white;opacity:.96;transform:skewX(-28deg)}
.brand-mark:before{width:9px;height:28px;right:11px;top:8px}
.brand-mark:after{width:9px;height:21px;right:23px;top:14px}
.brand-copy{min-width:0}
.brand-copy b{display:block;font-size:13px;line-height:1.45;white-space:nowrap}
.brand-copy small{display:block;color:var(--muted);font-size:10.5px;white-space:nowrap}
.desktop-nav{display:flex;align-items:center;gap:5px}
.nav-link{border:0;background:transparent;color:#5f7076;border-radius:10px;padding:8px 10px;font-size:11.5px;font-weight:800}
.nav-link:hover,.nav-link.active{background:#fff;color:var(--navy);box-shadow:var(--shadow-sm)}
.top-pill{font-size:10.5px;color:var(--copper);border:1px solid #e8cabc;background:#fff7f2;border-radius:99px;padding:5px 9px;white-space:nowrap}
.app{max-width:1180px;margin:auto;padding:0 20px 54px}
.hero{margin:20px 0 28px;min-height:500px;border-radius:34px;overflow:hidden;position:relative;background:
linear-gradient(120deg,rgba(8,45,54,.99),rgba(15,69,82,.95));
box-shadow:var(--shadow)}
.hero:before{content:"";position:absolute;inset:0;background:
radial-gradient(circle at 80% 15%,rgba(215,139,97,.23),transparent 28%),
linear-gradient(120deg,transparent 0 58%,rgba(255,255,255,.035) 58% 59%,transparent 59% 100%)}
.hero:after{content:"";position:absolute;left:-80px;bottom:-165px;width:430px;height:430px;border:70px solid rgba(255,255,255,.045);border-radius:50%}
.hero-grid{min-height:500px;display:grid;grid-template-columns:1.03fr .97fr;position:relative;z-index:1}
.hero-copy{padding:54px 46px 44px;color:#fff;display:flex;flex-direction:column;justify-content:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;color:#efb28d;font-size:12px;font-weight:900}
.eyebrow:before{content:"";width:24px;height:2px;background:var(--copper2);border-radius:4px}
.hero h1{font-size:45px;line-height:1.38;margin:12px 0 11px;letter-spacing:-1.1px}
.hero p{max-width:680px;margin:0;color:rgba(255,255,255,.76);font-size:14px}
.hero-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}
.btn{border:0;border-radius:13px;min-height:46px;padding:10px 16px;font-weight:900;font-size:12px;transition:.2s transform,.2s box-shadow,.2s background}
.btn:hover{transform:translateY(-1px)}
.btn-light{background:#fff;color:var(--navy);box-shadow:0 10px 22px rgba(0,0,0,.09)}
.btn-copper{background:var(--copper);color:#fff}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18)}
.hero-visual{position:relative;min-height:500px;overflow:hidden}
.mine-sky{position:absolute;inset:0;background:
linear-gradient(180deg,rgba(255,180,113,.07),transparent 40%),
radial-gradient(circle at 75% 20%,rgba(255,187,126,.36),transparent 18%)}
.mountain{position:absolute;bottom:0;background:#123c45;clip-path:polygon(0 100%,16% 56%,33% 69%,49% 39%,62% 58%,77% 33%,100% 63%,100% 100%)}
.mountain.back{left:0;right:-6%;height:67%;opacity:.75}
.mountain.front{left:-10%;right:0;height:51%;background:#0b343d;opacity:.98;clip-path:polygon(0 100%,11% 58%,24% 73%,41% 45%,58% 67%,71% 43%,87% 61%,100% 50%,100% 100%)}
.road{position:absolute;bottom:-13%;left:19%;width:58%;height:66%;background:linear-gradient(90deg,rgba(194,133,92,.16),rgba(255,255,255,.14),rgba(194,133,92,.17));clip-path:polygon(44% 0,59% 0,100% 100%,0 100%);transform:rotate(-4deg);filter:blur(.2px)}
.truck{position:absolute;bottom:18%;right:20%;width:146px;height:78px}
.truck-body{position:absolute;right:0;bottom:22px;width:103px;height:42px;border-radius:8px 5px 4px 4px;background:linear-gradient(145deg,#f0f2ef,#cbd4d1);box-shadow:0 12px 24px rgba(0,0,0,.20)}
.truck-cab{position:absolute;left:1px;bottom:22px;width:47px;height:52px;border-radius:10px 5px 3px 4px;background:linear-gradient(145deg,#fff,#cbd4d1)}
.truck-cab:after{content:"";position:absolute;left:7px;top:8px;width:24px;height:13px;background:#315660;border-radius:4px}
.wheel{position:absolute;bottom:6px;width:25px;height:25px;border-radius:50%;background:#101b1e;border:6px solid #28373a}
.w1{right:15px}.w2{right:57px}.w3{left:14px}
.truck-logo{position:absolute;right:19px;top:9px;font-weight:900;color:var(--copper3);font-size:9px}
.hero-stat{position:absolute;left:28px;bottom:28px;width:220px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);color:#fff;border-radius:18px;padding:14px}
.hero-stat strong{display:block;font-size:12px;margin-bottom:3px}
.hero-stat span{font-size:10.5px;color:rgba(255,255,255,.68)}
.section{margin:30px 0}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:14px}
.section-head h2{font-size:25px;line-height:1.45;margin:0}
.section-head p{margin:2px 0 0;color:var(--muted);font-size:12px}
.section-tag{font-size:10.5px;border-radius:99px;padding:5px 10px;background:#fff;border:1px solid var(--line);color:var(--muted)}
.track-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.track-card{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:24px;padding:19px;box-shadow:var(--shadow-sm);transition:.2s transform,.2s box-shadow,.2s border-color}
.track-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#d5c2b6}
.track-card:after{content:"";position:absolute;left:-35px;top:-35px;width:110px;height:110px;border:21px solid rgba(183,101,56,.06);border-radius:50%}
.track-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:var(--soft-copper);color:var(--copper);font-size:23px;margin-bottom:13px}
.track-card h3{font-size:19px;margin:0 0 4px}
.track-card p{font-size:11.5px;color:var(--muted);margin:0 0 14px;min-height:64px}
.meta-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:15px}
.chip{font-size:10.5px;border:1px solid var(--line);background:#f9faf8;border-radius:99px;padding:4px 8px;color:#66767b}
.track-action{display:flex;align-items:center;justify-content:space-between;border-top:1px dashed var(--line);padding-top:11px;color:var(--navy);font-size:11.5px;font-weight:900}
.arrow{font-size:16px;color:var(--copper)}
.principles{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.principle{background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px}
.principle b{font-size:11.5px;display:block}
.principle span{display:block;color:var(--muted);font-size:10.5px;margin-top:2px}
.page-hero{margin:20px 0 18px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:28px;padding:27px;position:relative;overflow:hidden}
.page-hero:after{content:"";position:absolute;left:-65px;bottom:-115px;width:260px;height:260px;border:45px solid rgba(255,255,255,.05);border-radius:50%}
.breadcrumb{font-size:10.5px;color:rgba(255,255,255,.65);display:flex;gap:6px;align-items:center;position:relative;z-index:1}
.breadcrumb button{border:0;background:transparent;color:inherit;padding:0}
.page-hero h1{font-size:31px;line-height:1.45;margin:7px 0 6px;position:relative;z-index:1}
.page-hero p{font-size:12px;color:rgba(255,255,255,.76);margin:0;max-width:760px;position:relative;z-index:1}
.page-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px;position:relative;z-index:1}
.page-meta span{font-size:10.5px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);border-radius:99px;padding:4px 9px}
.session-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.session-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:.2s}
.session-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.session-card:before{content:"";position:absolute;right:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--copper),var(--copper2))}
.session-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.session-no{width:40px;height:40px;border-radius:13px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:900}
.status{font-size:9.8px;border-radius:99px;padding:4px 8px;background:#f1f5f3;color:#587069}
.status.viewed{background:#e8f3ed;color:var(--success)}
.session-card h3{font-size:16px;line-height:1.65;margin:12px 0 5px}
.session-card p{font-size:11px;color:var(--muted);margin:0 0 10px;min-height:43px}
.session-info{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.session-info span{font-size:10px;color:#6d7b80;background:#f6f8f6;border-radius:8px;padding:3px 7px}
.session-link{width:100%;border:0;background:var(--soft-copper);color:var(--copper3);font-weight:900;border-radius:12px;min-height:42px;font-size:11px}
.session-detail{display:grid;grid-template-columns:1fr 310px;gap:14px;align-items:start}
.content-card,.side-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow-sm)}
.content-card h2{font-size:21px;margin:0 0 8px}
.content-card p{font-size:12px;color:#536a71;margin:0 0 13px}
.topic-list{display:grid;gap:7px;margin-top:10px}
.topic{display:flex;gap:9px;align-items:flex-start;background:#f7f9f7;border-radius:13px;padding:9px 10px;font-size:11.5px}
.topic i{font-style:normal;width:25px;height:25px;border-radius:8px;background:var(--soft-copper);color:var(--copper);display:grid;place-items:center;flex:0 0 25px;font-weight:900}
.key-message{margin-top:13px;background:linear-gradient(135deg,#f8ede6,#fff);border:1px solid #ecd4c6;border-radius:15px;padding:12px;color:#70472f;font-size:11.5px}
.key-message b{color:var(--copper3)}
.side-card h3{font-size:14px;margin:0 0 9px}
.side-card .big{font-size:29px;font-weight:900;color:var(--navy);line-height:1.3}
.side-card p{font-size:10.8px;color:var(--muted)}
.side-actions{display:grid;gap:7px;margin-top:12px}
.side-actions button{border:0;border-radius:11px;min-height:42px;font-weight:900;font-size:10.8px}
.complete-btn{background:var(--navy);color:#fff}
.back-btn{background:var(--soft);color:var(--navy)}
.ops-timeline{display:grid;gap:9px}
.ops-block{background:#fff;border:1px solid var(--line);border-radius:19px;padding:14px;display:grid;grid-template-columns:86px 1fr;gap:13px;align-items:start;box-shadow:var(--shadow-sm)}
.ops-time{background:var(--navy);color:#fff;border-radius:13px;padding:9px 7px;text-align:center;font-weight:900;font-size:11px}
.ops-block h3{font-size:14.5px;margin:0 0 3px}
.ops-block p{font-size:11px;color:var(--muted);margin:0}
.ops-block ul{margin:7px 0 0;padding-right:17px;color:#50676e;font-size:10.8px}
.ops-block.break{background:linear-gradient(135deg,#f7ece5,#fff)}
.ops-block.break .ops-time{background:var(--copper)}
.footer{margin-top:32px;border-top:1px solid var(--line);padding:23px 0 0;display:flex;justify-content:space-between;gap:15px;align-items:center;color:var(--muted);font-size:10.5px}
.footer b{color:var(--navy)}
.mobile-nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.mobile-nav-in{display:grid;grid-template-columns:repeat(4,1fr)}
.mobile-nav button{border:0;background:transparent;color:#728085;padding:7px 2px;min-height:58px;font-size:9.5px}
.mobile-nav button span{display:block;font-size:18px;line-height:1.2}
.mobile-nav button.active{color:var(--copper);font-weight:900}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:.25;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(max-width:900px){
 .hero-grid{grid-template-columns:1fr}.hero-visual{min-height:300px}.hero,.hero-grid{min-height:0}
 .hero-copy{padding:38px 29px 32px}.hero h1{font-size:36px}
 .track-grid{grid-template-columns:1fr}.principles{grid-template-columns:1fr 1fr}
 .session-detail{grid-template-columns:1fr}
}
@media(max-width:680px){
 body{padding-bottom:72px}.topbar-in{padding:8px 13px}.desktop-nav,.top-pill{display:none}.brand-copy b{font-size:12px}.brand-copy small{font-size:9.5px}
 .app{padding:0 12px 36px}.hero{margin-top:11px;border-radius:24px}.hero-copy{padding:29px 20px 25px}.hero h1{font-size:29px;letter-spacing:-.5px}
 .hero p{font-size:12px}.hero-visual{min-height:250px}.truck{right:16%;transform:scale(.85)}
 .section{margin:24px 0}.section-head{align-items:flex-start}.section-head h2{font-size:21px}.section-tag{display:none}
 .session-grid{grid-template-columns:1fr}.principles{grid-template-columns:1fr 1fr}
 .page-hero{margin-top:11px;border-radius:22px;padding:20px}.page-hero h1{font-size:25px}
 .ops-block{grid-template-columns:72px 1fr}.footer{flex-direction:column;align-items:flex-start;padding-bottom:10px}
 .mobile-nav{display:block}
}
@media(max-width:390px){
 .principles{grid-template-columns:1fr}.hero h1{font-size:26px}.hero-actions .btn{width:100%}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a href="#home" class="brand" aria-label="خانه">
      <div class="brand-mark" aria-hidden="true"></div>
      <div class="brand-copy">
        <b>ناوصنعت مس</b>
        <small>مدیریت رفتار سازمانی و فرهنگ</small>

    <nav class="desktop-nav" aria-label="ناوبری اصلی">

<script>
var managers=[
 {t:'از سازمان غیررسمی به سازمان حرفه‌ای',d:'وقتی سازمان بزرگ می‌شود، روش کار هم باید متناسب با رشد تغییر کند.',k:'حرفه‌ای‌شدن به معنای بوروکراتیک‌شدن نیست.',topics:['چه رفتارهایی از گذشته هنوز ارزشمندند؟','چه چیزهایی دیگر با اندازه امروز سازمان Fit نیستند؟','کجا باید نقش‌ها و قواعد روشن‌تر شوند؟','چگونه حرفه‌ای‌تر شویم بدون اینکه چابکی را از دست بدهیم؟']},
 {t:'اختیار، مسئولیت و مسیر تصمیم‌گیری',d:'دسترسی سریع را حفظ کنیم؛ اما مسئولیت و پاسخگویی را دور نزنیم.',k:'دسترسی باز خوب است؛ دورزدن مسئولیت نه.',topics:['اختیار واقعی هر سطح مدیریتی چیست؟','چرا مسیرهای غیررسمی شکل می‌گیرند؟','چه زمانی escalation ضروری است؟','چگونه هم سرعت را حفظ کنیم و هم accountability را؟']},
 {t:'صمیمیت، قانون‌مداری و مرز حرفه‌ای',d:'روابط گرم سرمایه سازمان‌اند؛ معیار حرفه‌ای و انصاف هم باید حفظ شوند.',k:'صمیمیت را حفظ کنیم؛ معیار حرفه‌ای را هم حفظ کنیم.',topics:['مرز صمیمیت و حرفه‌ای‌گری کجاست؟','چگونه تصمیم منصفانه بگیریم؟','مدیر چگونه consistency رفتاری ایجاد می‌کند؟','چه زمانی رابطه شخصی وارد تصمیم حرفه‌ای می‌شود؟']},
 {t:'از قول دادن تا بستن حلقه',d:'تمرکز بر تعهد، پیگیری، مالکیت کار و تبدیل قول به نتیجه.',k:'تعهد یعنی پیگیری تا نتیجه.',topics:['تعهد حرفه‌ای دقیقاً چیست؟','چگونه owner، output و deadline را روشن کنیم؟','چرا بعضی اقدامات در میانه راه رها می‌شوند؟','Closing the loop چه نقشی در اعتماد سازمانی دارد؟']},
 {t:'اختلاف مدیریتی بدون تخریب همکاری',d:'اختلاف نظر طبیعی است؛ شخصی‌شدن اختلاف، همکاری را فرسوده می‌کند.',k:'اختلاف نظر نباید همکاری را متوقف کند.',topics:['چگونه مسئله را از شخص جدا کنیم؟','چگونه اختلاف را به کارکنان منتقل نکنیم؟','هدف مشترک را چگونه دوباره پیدا کنیم؟','همکاری چگونه حتی بدون توافق کامل ادامه پیدا می‌کند؟']},
 {t:'از فرهنگ مطلوب تا اقدام مدیریتی',d:'از گفت‌وگو درباره فرهنگ به الگوی مشترک رفتاری و اقدام مدیریتی برسیم.',k:'فرهنگ، چیزی است که هر روز تکرار می‌کنیم.',topics:['چه رفتارهایی باید تقویت شوند؟','چه رفتارهایی باید متوقف شوند؟','مدیران چه الگوی مشترکی باید بسازند؟','چگونه اقدام‌های کوچک را به یک management rhythm تبدیل کنیم؟']}
