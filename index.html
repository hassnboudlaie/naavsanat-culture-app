<script>
/* A slow or failed bundle should never leave learners in an endless loading state. */
window.setTimeout(function(){
 const loader=document.querySelector('#root .load-message');
 if(!loader||!loader.isConnected)return;
 loader.textContent='بارگذاری محیط یادگیری بیشتر از معمول طول کشیده است. اتصال اینترنت را بررسی کنید و دوباره تلاش کنید.';
 if(document.getElementById('naavReload'))return;
 const retry=document.createElement('button');
 retry.type='button';retry.id='naavReload';retry.className='load-retry';
 retry.textContent='تلاش دوباره';retry.addEventListener('click',function(){location.reload();});
 loader.insertAdjacentElement('afterend',retry);
},10000);
</script>
</body>
