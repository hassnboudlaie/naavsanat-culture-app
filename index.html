function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function readState(key,fallback){try{var x=JSON.parse(localStorage.getItem(key));return x==null?fallback:x}catch(e){return fallback}}
function saveState(key,x){try{localStorage.setItem(key,JSON.stringify(x));return true}catch(e){return false}}
var activeRole=readState('naavsanat_v3_role','hq');
function selectedRole(){return ROLES[activeRole]?activeRole:'hq'}
function chooseRole(r){if(ROLES[r]){activeRole=r;saveState('naavsanat_v3_role',r)}}
function getVisited(){var v=readState('naavsanat_v2_visited',{});return v&&typeof v==='object'?v:{}}
function markDone(key){var v=getVisited();v[key]=true;if(!saveState('naavsanat_v2_visited',v)){announce('ذخیره در این مرورگر امکان‌پذیر نیست.');return}render()}
function goRoute(route){if(ROLES[route])chooseRole(route);var h='#'+(route||'home');if(location.hash===h)render();else location.hash=h}
function caseRoute(id,role,step){return 'case-'+Math.floor((id-1)/5)+'-'+((id-1)%5)+'/'+role+'/'+(step||0)}
function openCase(id,role){chooseRole(role);goRoute(caseRoute(id,role,0))}
function switchCaseRole(id,role,step){chooseRole(role);goRoute(caseRoute(id,role,step))}
function roleSwitch(role,id,step){return '<div class="role-switch" role="group" aria-label="انتخاب مخاطب">'+Object.keys(ROLES).map(function(r){return '<button class="'+(r===role?'selected':'')+'" aria-pressed="'+(r===role)+'" onclick="'+(id?'switchCaseRole('+id+',\''+r+'\','+(step||0)+')':'chooseRole(\''+r+'\');render()')+'">'+ROLES[r].title+'</button>'}).join('')+'</div>'}
function caseKey(id,role){return role+'-'+id}
function isDone(id,role){return !!readState('naavsanat_v3_done',{})[caseKey(id,role)]}
function toggleCaseDone(id,role){var v=readState('naavsanat_v3_done',{}),key=caseKey(id,role);v[key]=!v[key];if(!saveState('naavsanat_v3_done',v)){announce('ذخیره در این مرورگر امکان‌پذیر نیست.');return}render()}
function caseCount(role){return CASES.filter(function(c){return isDone(c.id,role)}).length}
function smallCaseCards(ids,role){return '<div class="case-grid">'+ids.map(function(id){var c=CASES[id-1];return '<button class="case-card" onclick="openCase('+id+',\''+role+'\')"><span class="case-num">'+fa(id)+'</span><span class="case-copy"><b>'+esc(c.title)+'</b><small>'+esc(c.concept)+' · '+(isDone(id,role)?'مرور شده':'۶ بخش')+'</small><span class="case-open">باز کردن کیس ←</span></span></button>'}).join('')+'</div>'}
function landing(){return '<div class="fade identity-wrap"><section class="identity-hero"><div class="identity-mark" aria-hidden="true">N</div><span class="eyebrow" dir="ltr">NAAVSANAT LEARNING EXPERIENCE</span><h1>از مسئله واقعی<br>تا رفتار حرفه‌ای</h1><p>کارگاه رفتار سازمانی و فرهنگ شرکت بین‌المللی ناوصنعت مس</p><p class="instructor">مدرس و تسهیلگر: دکتر حسن بودلایی</p></section><section class="identity-question"><h2>شما در ناوصنعت کجا هستید؟</h2><p>نقش خود را انتخاب کنید؛ مثال‌ها و اقدام‌ها متناسب با همان نقش‌اند.</p></section><section class="identity-grid">'+identityCard('hq','▦',ROLES.hq.title,ROLES.hq.focus)+identityCard('managers','◈',ROLES.managers.title,ROLES.managers.focus)+identityCard('operations','⚙',ROLES.operations.title,ROLES.operations.focus)+'</section><section class="home-cases"><div><b>۱۵ کیس · ۳ مسیر · ۴۵ نسخه آموزشی</b><br><span>صورت مسئله، ریشه‌یابی، درس، نکته، اقدام و بحث کلاسی</span></div><button onclick="goRoute(\'cases\')">ورود به کیس‌ها ←</button></section><button class="context-link" onclick="goRoute(\'context\')">شناخت ناوصنعت و مبنای طراحی محتوا ←</button>'+footer()+'</div>'}
function trackPage(type){var data=type==='managers'?managers:hq,title=ROLES[type].title;chooseRole(type);var visited=getVisited();return '<div class="fade"><section class="page-hero"><div class="breadcrumb"><button onclick="goRoute(\'home\')">خانه</button><span>←</span><span>'+title+'</span></div><h1>مسیر '+title+'</h1><p>'+ROLES[type].focus+'؛ از تحلیل کیس به اقدام در محیط کار.</p><div class="page-meta"><span>۶ جلسه پیشنهادی</span><span>۲ ساعت برای هر جلسه</span><span>۱۵ کیس با نسخه اختصاصی</span></div></section><div class="track-toolbar"><button class="btn btn-copper" onclick="goRoute(\'cases\')">کتابخانه ۱۵ کیس</button><span>'+fa(caseCount(type))+' از ۱۵ کیس مرور شده در این دستگاه</span></div><section class="section"><div class="section-head"><div><h2>جلسات مسیر</h2><p>هر جلسه را مستقل باز کنید؛ می‌توانید بین کیس‌ها رفت‌وبرگشت داشته باشید.</p></div></div><div class="session-grid">'+data.map(function(s,i){return '<article class="session-card"><div class="session-top"><div class="session-no">'+fa(i+1)+'</div><span class="status '+(visited[type+'-'+i]?'viewed':'')+'">'+(visited[type+'-'+i]?'مرور شده':fa(sessionCases[type][i].length)+' کیس')+'</span></div><h3>'+esc(s.t)+'</h3><p>'+esc(s.d)+'</p><button class="session-link" onclick="goRoute(\''+type+'-'+i+'\')">ورود به جلسه ←</button></article>'}).join('')+'</div></section><p class="schedule-note">چینش ۶ جلسه‌ای، مسیر آموزشی فعلی اپ است؛ زمان‌بندی اجرایی با برنامه نهایی مدرس تنظیم می‌شود.</p>'+footer()+'</div>'}
function sessionPage(type,index){var data=type==='managers'?managers:hq,s=data[index];if(!s)return trackPage(type);chooseRole(type);return '<div class="fade"><section class="page-hero"><div class="breadcrumb"><button onclick="goRoute(\''+type+'\')">'+ROLES[type].title+'</button><span>←</span><span>جلسه '+fa(index+1)+'</span></div><h1>'+esc(s.t)+'</h1><p>'+esc(s.d)+'</p><div class="page-meta"><span>جلسه '+fa(index+1)+' از ۶</span><span>۲ ساعت پیشنهادی</span></div></section><div class="content-card session-intro"><h2>هدف جلسه</h2><p>'+esc(s.k)+'</p><details><summary>محورهای گفت‌وگو و شیوه اجرا</summary><ul>'+s.topics.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul><p>۱۵ دقیقه شروع و تجربه‌ها؛ ۶۰ دقیقه بررسی کیس‌ها؛ ۳۰ دقیقه تمرین نقش و طراحی اقدام؛ ۱۵ دقیقه جمع‌بندی و تعهد. این تقسیم زمان پیشنهادی است.</p></details></div><section class="section"><div class="section-head"><div><h2>کیس‌های این جلسه</h2><p>برای هر کیس، هر شش بخش را به ترتیب یا مستقل باز کنید.</p></div></div>'+smallCaseCards(sessionCases[type][index],type)+'</section><div class="key-message"><b>خروجی جلسه:</b> یک رفتار مطلوب قابل مشاهده، یک اقدام در حدود اختیار و یک زمان پیگیری. نتیجه را در بخش اقدام هر کیس ثبت کنید.</div><div class="case-nav-row"><button class="allcases" onclick="markDone(\''+type+'-'+index+'\')">جلسه را مرور کردم</button><button class="prevnext" onclick="goRoute(\''+type+'\')">همه جلسات</button></div>'+footer()+'</div>'}
function operationsPage(){chooseRole('operations');var titles=['شروع: برنامه روشن و رفتار حرفه‌ای','ایمنی و امکان بیان نگرانی','تعهد، اطلاعات و فشار زمان','همکاری در شیفت و بین واحدها','ورود به کار، اختیار و تحویل'];return '<div class="fade"><section class="page-hero"><div class="breadcrumb"><button onclick="goRoute(\'home\')">خانه</button><span>←</span><span>عملیات</span></div><h1>مسیر کارکنان عملیاتی</h1><p>موقعیت‌های کوتاه از کار در سایت، مسیر و شیفت؛ با بیان ساده و اقدام مشخص.</p><div class="page-meta"><span>برنامه یک‌روزه</span><span>۱۵ کیس در ۵ بخش</span><span>قابل اجرا با گفت‌وگوی شفاهی</span></div></section><div class="track-toolbar"><button class="btn btn-copper" onclick="goRoute(\'cases\')">همه کیس‌های عملیات</button><span>'+fa(caseCount('operations'))+' از ۱۵ کیس مرور شده در این دستگاه</span></div><div class="content-card"><h2>روش اجرا</h2><p>مدرس سناریو را می‌خواند؛ افراد ابتدا می‌گویند چه می‌کنند. سپس علت، رفتار مناسب و اقدام را با هم مرور می‌کنند. پرسش‌ها را می‌توان شفاهی پاسخ داد.</p><details><summary>راهنمای زمان‌بندی مدرس</summary><p>برای یک روز شامل حدود ۶ ساعت فعالیت، ۲۰ دقیقه شروع، پنج بخش ۵۰ دقیقه‌ای، دو استراحت ۱۵ دقیقه‌ای و ۳۰ دقیقه جمع‌بندی پیشنهاد می‌شود. در هر بخش یک کیس را عمیق و دو کیس را کوتاه مرور کنید؛ همه ۱۵ کیس برای مراجعه بعدی در دسترس‌اند.</p></details></div>'+opsCaseBlocks.map(function(ids,i){return '<section class="section"><div class="section-head"><div><h2>'+fa(i+1)+'. '+titles[i]+'</h2><p>سناریو ← گفت‌وگو ← تمرین ← یک اقدام</p></div></div>'+smallCaseCards(ids,'operations')+'</section>'}).join('')+'<div class="key-message"><b>تعهد پایان روز:</b> هر نفر یک رفتار را انتخاب کند، بگوید در کدام موقعیت آن را اجرا می‌کند و در شیفت بعد نتیجه را با سرپرست مرور کند.</div>'+footer()+'</div>'}
function casesPage(){var role=selectedRole();return '<div class="fade"><section class="page-hero"><div class="breadcrumb"><button onclick="goRoute(\'home\')">خانه</button><span>←</span><span>کیس‌ها</span></div><h1>۱۵ کیس ناوصنعت</h1><p>یک موضوع مشترک، سه زاویه دید. نقش خود را انتخاب کنید و وارد کیس شوید.</p><div class="page-meta"><span>۳ دسته × ۵ کیس</span><span>۶ بخش ثابت</span><span>۴۵ نسخه مخاطب‌محور</span></div></section>'+roleSwitch(role)+'<div class="library-summary"><b>نسخه '+ROLES[role].title+'</b><span>'+fa(caseCount(role))+' از ۱۵ کیس مرور شده</span></div><p class="scenario-note">روایت‌ها سناریوهای آموزشیِ اقتباسی از محورهای مسائل ناوصنعت‌اند؛ جزئیات هر اتفاق و علت آن باید با شواهد شرکت اعتبارسنجی شود.</p>'+GROUPS.map(function(g,i){return '<section class="case-category"><div class="case-category-head"><h2>'+g+'</h2><span>۵ کیس</span></div>'+smallCaseCards([i*5+1,i*5+2,i*5+3,i*5+4,i*5+5],role)+'</section>'}).join('')+'<button class="context-link" onclick="goRoute(\'context\')">شناخت شرکت، منابع و راهنمای استفاده ←</button>'+footer()+'</div>'}
function paragraph(x){return '<p>'+esc(x)+'</p>'}
function caseBody(c,role,step){var v=c.variants[role];if(step===0)return '<div class="scenario-tag">سناریوی آموزشی · برای گفت‌وگو و اعتبارسنجی</div>'+paragraph(v.problem)+'<div class="reflect-prompt"><b>قبل از دیدن تحلیل:</b> در این موقعیت چه می‌کنید؟ کدام رفتار را واقعاً مشاهده کرده‌اید و کدام بخش برداشت شماست؟</div>';if(step===1)return paragraph(v.analysis)+'<div class="evidence-prompt"><b>چه شاهدی لازم داریم؟</b>'+paragraph(c.evidence)+'</div><details><summary>راهنمای مدرس: از فرضیه به تشخیص</summary><p>رفتار را از شخصیت جدا کنید. مشخص کنید مسئله از آگاهی، مهارت، منابع، فرایند، اختیار، فشار کاری یا واکنش مدیریتی می‌آید. مثال تازه و بی‌نام بگیرید و یک توضیح جایگزین را هم بررسی کنید. تحلیل این صفحه تشخیص قطعی شرکت نیست.</p></details>';if(step===2)return '<blockquote>'+esc(v.lesson)+'</blockquote><p class="english-term" dir="auto">'+esc(c.concept)+'</p><div class="reflect-prompt">این درس در نقش شما به چه رفتار قابل مشاهده‌ای تبدیل می‌شود؟</div>';if(step===3)return '<div class="key-takeaway">'+esc(v.note)+'</div><p>از یک مثال در کار روزمره خود بگویید که این نکته در آن اهمیت دارد.</p>';if(step===4)return '<ol class="action-list">'+v.solution.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ol><details><summary>اقدام پیشنهادی را به توافق اجرایی تبدیل کنیم</summary><p>اقدام‌ها پیشنهاد آموزشی‌اند. پیش از اجرا، مسئول دارای اختیار، منابع لازم، موعد و شاهد انجام را مشخص کنید. زمان‌ها و معیارهای پیشنهادی با شرایط واقعی واحد تنظیم می‌شوند.</p></details>'+actionForm(c.id,role);return '<ol class="question-list">'+v.questions.map(function(q){return '<li>'+esc(q)+'</li>'}).join('')+'</ol><details><summary>پیام مدرس و نکات تسهیلگری</summary><p>'+esc(v.lesson)+'</p><p>ابتدا تجربه افراد را بشنوید؛ سپس بپرسید «چه شاهدی داریم؟ چه چیزی در اختیار ماست؟ قدم بعدی چیست؟» از نام‌بردن اشخاص و طرح جزئیات حساس در جمع پرهیز کنید. خروجی بحث یک اقدام مشخص باشد.</p></details>'+discussionForm(c.id,role)}
function noteRecord(id,role){var n=readState('naavsanat_v3_notes',{});return n[caseKey(id,role)]||{}}
function inputField(name,label,value,area){return '<label class="form-field">'+label+(area?'<textarea name="'+name+'" rows="3" maxlength="4000">'+esc(value||'')+'</textarea>':'<input name="'+name+'" maxlength="240" value="'+esc(value||'')+'">')+'</label>'}
function actionForm(id,role){var n=noteRecord(id,role);return '<form class="worksheet" onsubmit="saveWorksheet(event,'+id+',\''+role+'\')"><h3>اقدام بعدی من</h3><p class="local-note">اختیاری؛ فقط در همین مرورگر ذخیره می‌شود و برای مدرس یا شرکت ارسال نمی‌شود. اطلاعات حساس و نام افراد را ننویسید.</p>'+inputField('action','چه کاری انجام می‌دهم؟',n.action,true)+'<div class="form-grid">'+inputField('owner','مسئول اقدام (عنوان نقش)',n.owner)+inputField('due','زمان پیگیری',n.due)+'</div>'+inputField('proof','چه شاهدی نشان می‌دهد انجام شده؟',n.proof,false)+'<button class="btn btn-copper" type="submit">ذخیره اقدام</button><span class="save-status" role="status"></span></form>'}
function discussionForm(id,role){var n=noteRecord(id,role);return '<form class="worksheet" onsubmit="saveWorksheet(event,'+id+',\''+role+'\')"><h3>یادداشت بحث</h3><p class="local-note">اختیاری و مخصوص این مرورگر؛ مثال را بی‌نام و بدون اطلاعات حساس بنویسید. پاسخ شفاهی هم کافی است.</p>'+inputField('observation','رفتار مشاهده‌شده و اثر آن',n.observation,true)+inputField('hypothesis','علت احتمالی و شاهد مورد نیاز',n.hypothesis,true)+'<button class="btn btn-copper" type="submit">ذخیره یادداشت</button><span class="save-status" role="status"></span></form>'}
function saveWorksheet(event,id,role){event.preventDefault();var all=readState('naavsanat_v3_notes',{}),key=caseKey(id,role),n=all[key]||{};new FormData(event.target).forEach(function(value,name){n[name]=String(value)});all[key]=n;var ok=saveState('naavsanat_v3_notes',all);event.target.querySelector('.save-status').textContent=ok?'در این مرورگر ذخیره شد.':'ذخیره ممکن نشد؛ یادداشت را کپی کنید.'}
function casePage(gi,ci,role,step){var id=gi*5+ci+1,c=CASES[id-1];if(!c||gi<0||gi>2||ci<0||ci>4)return casesPage();role=ROLES[role]?role:selectedRole();step=Number.isInteger(step)&&step>=0&&step<6?step:0;chooseRole(role);var done=isDone(id,role);return '<div class="fade"><section class="page-hero case-heading"><div class="breadcrumb"><button onclick="goRoute(\'cases\')">۱۵ کیس</button><span>←</span><span>کیس '+fa(id)+'</span></div><h1>'+esc(c.title)+'</h1><p>'+GROUPS[gi]+'</p><div class="page-meta"><span>'+ROLES[role].title+'</span><span>بخش '+fa(step+1)+' از ۶</span><span dir="auto">'+esc(c.concept)+'</span></div></section>'+roleSwitch(role,id,step)+'<div class="case-workspace"><nav class="case-step-nav" aria-label="بخش‌های کیس">'+STEPS.map(function(s,i){return '<button class="'+(i===step?'active':'')+'" '+(i===step?'aria-current="step"':'')+' onclick="goRoute(\''+caseRoute(id,role,i)+'\')"><span class="step-number">'+fa(i+1)+'</span><span>'+s+'</span></button>'}).join('')+'</nav><article class="case-reading" id="case-reading"><div class="reading-header"><span class="section-tag">'+fa(step+1)+' / ۶</span><span dir="ltr">'+STEP_EN[step]+'</span></div><h2>'+STEPS[step]+'</h2>'+caseBody(c,role,step)+'<div class="step-pagination">'+(step>0?'<button class="prevnext" onclick="goRoute(\''+caseRoute(id,role,step-1)+'\')">→ بخش قبل</button>':'<span></span>')+(step<5?'<button class="next-step" onclick="goRoute(\''+caseRoute(id,role,step+1)+'\')">بخش بعد ←</button>':'<button class="next-step" onclick="toggleCaseDone('+id+',\''+role+'\')">'+(done?'لغو علامت مرور':'کیس را مرور کردم ✓')+'</button>')+'</div></article></div><div class="case-nav-row"><button class="prevnext" '+(id===1?'disabled':'onclick="openCase('+(id-1)+',\''+role+'\')"')+'>→ کیس قبل</button><button class="allcases" onclick="goRoute(\'cases\')">همه ۱۵ کیس</button><button class="prevnext" '+(id===15?'disabled':'onclick="openCase('+(id+1)+',\''+role+'\')"')+'>کیس بعد ←</button></div><details class="export-panel"><summary>یادداشت‌ها و اقدام‌های من</summary><p>ذخیره‌ها به همین دستگاه، مرورگر و آدرس سایت وابسته‌اند؛ با پاک‌شدن داده مرورگر حذف می‌شوند. برای نگهداری یک نسخه، خروجی بگیرید.</p><button class="btn btn-copper" onclick="exportNotes(\''+role+'\')">دریافت یادداشت‌های این مسیر</button><button class="btn btn-outline" onclick="printCase('+id+',\''+role+'\')">چاپ شش بخش این کیس</button></details>'+footer()+'</div>'}
function exportNotes(role){var lines=['ناوصنعت مس | یادداشت‌های شخصی مسیر '+ROLES[role].title,'این متن شامل یادداشت شخصی است و گزارش تأییدشده شرکت نیست.',''];CASES.forEach(function(c){var n=noteRecord(c.id,role);if(!Object.keys(n).length)return;lines.push('کیس '+fa(c.id)+': '+c.title);var labels={action:'اقدام',owner:'مسئول',due:'زمان پیگیری',proof:'شاهد انجام',observation:'مشاهده',hypothesis:'فرضیه و شاهد لازم'};Object.keys(labels).forEach(function(k){if(n[k])lines.push(labels[k]+': '+n[k])});lines.push('')});if(lines.length===3){announce('برای این مسیر هنوز یادداشتی ذخیره نشده است.');return}var blob=new Blob(['\uFEFF'+lines.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='naavsanat-notes-'+role+'.txt';a.click();setTimeout(function(){URL.revokeObjectURL(url)},1000)}
function printCase(id,role){var c=CASES[id-1],v=c.variants[role],area=document.getElementById('print-area');area.innerHTML='<h1>'+esc(c.title)+'</h1><p>کیس '+fa(id)+' | '+ROLES[role].title+' | مدرس: دکتر حسن بودلایی</p><p>سناریوی آموزشی اقتباسی؛ ریشه‌ها نیازمند اعتبارسنجی با شواهد شرکت‌اند.</p>'+STEPS.map(function(s,i){var body=i===0?v.problem:i===1?v.analysis:i===2?v.lesson:i===3?v.note:null;return '<section><h2>'+fa(i+1)+'. '+s+'</h2>'+(body?paragraph(body):'<ol>'+(i===4?v.solution:v.questions).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol>')+'</section>'}).join('');window.print()}
function contextPage(){return '<div class="fade"><section class="page-hero"><div class="breadcrumb"><button onclick="goRoute(\'home\')">خانه</button><span>←</span><span>شناخت شرکت</span></div><h1>ناوصنعت؛ زمینه واقعی یادگیری</h1><p>شرکت بین‌المللی ناوصنعت مس در بستر حمل‌ونقل و خدمات مرتبط با صنعت مس.</p></section><section class="context-grid"><article class="content-card"><h2>هویت و دامنه فعالیت</h2><p>معرفی رسمی هلدینگ مس سرچشمه، تأسیس شرکت را در سال ۱۳۸۸ و تمرکز تخصصی بر حمل مواد اسیدی بیان می‌کند. خدمات بارگیری و تخلیه، تعمیر ناوگان، تأمین قطعه و فعالیت‌های گمرکی و بازرگانی نیز در دامنه موضوع فعالیت ذکر شده‌اند.</p><p>موضوع فعالیت با فهرست قراردادهای فعال یکسان نیست. از عنوان «بین‌المللی» به‌تنهایی، وجود مسیر برون‌مرزی مشخص یا عملیات فعال در کشور معین را نتیجه نمی‌گیریم.</p><a class="source-link" href="https://scico.ir/شرکت-های-تابعه/شرکت-بین-المللی-ناو-صنعت/" target="_blank" rel="noopener noreferrer">معرفی رسمی شرکت در هلدینگ مس سرچشمه ↗</a></article><article class="content-card"><h2>چرا فرهنگ و رفتار اهمیت دارد؟</h2><p>اسناد برنامه ناوصنعت بر حمل‌ونقل عمدتاً جاده‌ای، رانندگان و کارکنان میدانی، تعدد مسیر و سایت و فاصله ستاد و میدان تأکید دارند. تصمیم ستاد، آمادگی ناوگان، تحویل شیفت و پاسخ به مشکل میدان باید به هم متصل باشند.</p><p>استنباط طراحی ما: پراکندگی، نیاز به پیام روشن، مرجع تصمیم مشخص، تحویل پذیرفته‌شده و پیگیری تا نتیجه را بیشتر می‌کند. این استنباط جای ممیزی میدانی را نمی‌گیرد.</p></article></section><section class="content-card context-section"><h2>زنجیره همکاری که در کیس‌ها می‌بینید</h2><p class="chain-text">نیاز مشتری و برنامه حمل ← هماهنگی ستاد و سایت ← آمادگی افراد، وسیله و مدارک ← اجرای کار طبق الزامات محل ← تحویل نتیجه و اسناد ← بازخورد و یادگیری</p><p>نقاط تعامل شامل عملیات، فنی و تعمیرات، مالی، منابع انسانی، ایمنی، سرپرست، راننده و نماینده مشتری است. این نقشه برای تحلیل آموزشی است و ادعای ارائه چارت مصوب شرکت ندارد.</p></section><section class="content-card context-section"><h2>پراکندگی جغرافیایی و ماهیت بین‌المللی</h2><p>کیس‌ها رابطه ستاد مرکزی با سایت معدنی، محل بارگیری، مسیر و مقصد را پوشش می‌دهند. نام و تعداد سایت‌های فعال، مسیرها، ناوگان و ساختار دقیق فعلی در اسناد در دسترس این مرحله تأیید نشده‌اند؛ بنابراین عدد یا مسیر معینی به شرکت نسبت داده نشده است.</p><p>در مثال‌های برون‌مرزی فرضی، هماهنگی اسناد و نماینده مقصد هم در نظر گرفته شده است. کاربرد این بخش در شرکت باید با قرارداد و مسیر واقعی اعتبارسنجی شود.</p></section><section class="content-card context-section"><h2>مبنای محتوایی و منابع</h2><ul class="sources-list"><li>نشست توسعه سازمان و مدیریت ناوصنعت مس: زمینه عملیاتی و پرسش‌های آسیب‌شناسی، شهریور ۱۴۰۵.</li><li>پیشنهاد برنامه توسعه مدیریت، رفتار و فرهنگ سازمانی و پیشنهاد تکمیلی: رویکرد مسئله‌محور و طراحی اختصاصی برای گروه‌ها، شهریور و مهر ۱۴۰۵. جزئیات تجاری این اسناد در اپ منتشر نشده است.</li><li>فهرست ۱۵ محور اعلام‌شده توسط مدرس: ستون فقرات کیس‌ها. روایت‌ها، تحلیل‌ها و اقدام‌های جزئی، برای آموزش تدوین شده‌اند.</li><li><a class="source-link" href="https://mespress.ir/news/10570/" target="_blank" rel="noopener noreferrer">گزارش تاریخی مس‌پرس، ۲۶ آذر ۱۴۰۳ ↗</a>: زمینه رشد فعالیت حمل؛ آمار آن به‌عنوان وضعیت فعلی نمایش داده نشده است.</li><li><a class="source-link" href="https://www.hse.gov.uk/roadsafety/employer/" target="_blank" rel="noopener noreferrer">HSE: مدیریت ریسک رانندگی شغلی ↗</a> و <a class="source-link" href="https://www.hse.gov.uk/roadsafety/employer/look-after-workers-health.htm" target="_blank" rel="noopener noreferrer">سلامت و خستگی راننده ↗</a>: مرجع عمومی طراحی آموزشی؛ الزامات حقوقی بریتانیا به ایران تعمیم داده نشده است.</li></ul></section><section class="content-card context-section"><h2>چگونه از کیس به تشخیص و اقدام برسیم؟</h2><ol><li>از فرد بخواهید رفتار و پیامد را با مثال بی‌نام توضیح دهد.</li><li>علت احتمالی را از واقعیت جدا کنید و شاهد مخالف را هم بررسی کنید.</li><li>رفتار مطلوب و یک اقدام ممکن در حدود اختیار را تعریف کنید.</li><li>مسئول، موعد و شاهد نتیجه را توافق و در جلسه بعد مرور کنید.</li></ol><p>محتوای ایمنی، آموزش رفتار و مدیریت است؛ ارزیابی ریسک، مجوز کار، کنترل فنی و واکنش اضطراری تابع دستورالعمل مصوب و مسئول صلاحیت‌دار محل است.</p><p>یادداشت‌های اپ فقط در مرورگر کاربر ذخیره می‌شوند؛ این نسخه سامانه جمع‌آوری متمرکز پاسخ یا گزارش محرمانه کارکنان نیست.</p></section><div class="case-nav-row"><button class="allcases" onclick="goRoute(\'cases\')">ورود به ۱۵ کیس ←</button></div>'+footer()+'</div>'}
function announce(msg){var e=document.getElementById('announcement');e.textContent=msg;e.hidden=false}
function render(){var route=(location.hash||'#home').slice(1),html;document.getElementById('announcement').hidden=true;if(route==='home'||!route)html=landing();else if(route==='managers'||route==='hq')html=trackPage(route);else if(route==='operations')html=operationsPage();else if(route==='cases')html=casesPage();else if(route==='context')html=contextPage();else{var cm=route.match(/^case-(\d+)-(\d+)(?:\/(hq|managers|operations)(?:\/(\d+))?)?$/),m=route.match(/^(managers|hq)-(\d+)$/);html=cm?casePage(Number(cm[1]),Number(cm[2]),cm[3],Number(cm[4]||0)):m?sessionPage(m[1],Number(m[2])):landing()}document.getElementById('app').innerHTML=html;document.querySelectorAll('[data-route]').forEach(function(b){var r=b.getAttribute('data-route'),active=route===r||route.indexOf(r+'-')===0||r==='cases'&&route.indexOf('case-')===0;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});var h=document.querySelector('main h1');document.title=(h?h.textContent+' | ':'')+'ناوصنعت مس';if(h){h.tabIndex=-1;h.focus({preventScroll:true})}window.scrollTo(0,0)}
window.addEventListener('hashchange',render);
