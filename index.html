<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#082d36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>مدیریت رفتار سازمانی و فرهنگ | ناوصنعت مس</title>
<style>
:root{
  --navy:#082d36;--navy2:#0f4552;--navy3:#176070;
  --copper:#b76538;--copper2:#d78b61;--copper3:#8e472b;
  --paper:#f3f4ef;--warm:#fbfaf7;--card:#ffffff;--ink:#173139;--muted:#718087;
  --line:#dfe5e2;--soft:#edf2ef;--soft-copper:#f7ebe4;--success:#2e7659;
  --shadow:0 18px 48px rgba(8,45,54,.10);--shadow-sm:0 9px 24px rgba(8,45,54,.07);
  --radius:26px;--radius-sm:17px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:
radial-gradient(circle at 10% 0%,rgba(183,101,56,.10),transparent 27%),
linear-gradient(180deg,#f7f8f5 0%,var(--paper) 100%);
color:var(--ink);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.85;-webkit-font-smoothing:antialiased}
button,a{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid rgba(215,139,97,.42);outline-offset:3px}
.topbar{position:sticky;top:0;z-index:50;background:rgba(247,248,245,.91);backdrop-filter:blur(16px);border-bottom:1px solid rgba(223,229,226,.85)}
.topbar-in{max-width:1180px;margin:auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{width:44px;height:44px;flex:0 0 44px;border-radius:13px;background:linear-gradient(145deg,#d68052,#8e472b);position:relative;box-shadow:0 10px 20px rgba(183,101,56,.22);overflow:hidden}
.brand-mark:before,.brand-mark:after{content:"";position:absolute;background:white;opacity:.96;transform:skewX(-28deg)}
.brand-mark:before{width:9px;height:28px;right:11px;top:8px}
.brand-mark:after{width:9px;height:21px;right:23px;top:14px}
.brand-copy{min-width:0}
.brand-copy b{display:block;font-size:13px;line-height:1.45;white-space:nowrap}
.brand-copy small{display:block;color:var(--muted);font-size:10.5px;white-space:nowrap}
.desktop-nav{display:flex;align-items:center;gap:5px}
.nav-link{border:0;background:transparent;color:#5f7076;border-radius:10px;padding:8px 10px;font-size:11.5px;font-weight:800}
.nav-link:hover,.nav-link.active{background:#fff;color:var(--navy);box-shadow:var(--shadow-sm)}
.top-pill{font-size:10.5px;color:var(--copper);border:1px solid #e8cabc;background:#fff7f2;border-radius:99px;padding:5px 9px;white-space:nowrap}
.dashboard-sidebar{position:fixed;right:0;top:0;bottom:0;width:238px;background:linear-gradient(180deg,var(--navy),#0a3944);color:#fff;z-index:80;padding:22px 16px;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(8,45,54,.10)}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:4px 4px 20px;border-bottom:1px solid rgba(255,255,255,.10)}
.sidebar-brand .brand-mark{box-shadow:none}
.sidebar-brand b{display:block;font-size:13px}
.sidebar-brand small{display:block;color:rgba(255,255,255,.58);font-size:9.8px;margin-top:2px}
.sidebar-title{font-size:9.8px;color:rgba(255,255,255,.45);padding:18px 8px 7px}
.sidebar-nav{display:grid;gap:6px}
.sidebar-nav button{border:0;background:transparent;color:rgba(255,255,255,.72);border-radius:12px;min-height:44px;padding:8px 11px;text-align:right;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:space-between}
.sidebar-nav button:hover,.sidebar-nav button.active{background:rgba(255,255,255,.10);color:#fff}
.sidebar-nav .sicon{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.08);display:grid;place-items:center;color:#f0b18b}
.sidebar-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.10);padding:14px 6px 0;color:rgba(255,255,255,.48);font-size:9px;line-height:1.7}
.identity-wrap{max-width:980px;margin:26px auto}
.identity-hero{background:#fff;border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:var(--shadow-sm);text-align:center}
.identity-mark{width:58px;height:58px;margin:0 auto 13px;border-radius:17px;background:linear-gradient(145deg,var(--copper2),var(--copper3));display:grid;place-items:center;color:#fff;font-size:25px;font-weight:900;box-shadow:0 12px 28px rgba(183,101,56,.20)}
.identity-hero .eyebrow{justify-content:center}
.identity-hero h1{font-size:34px;line-height:1.45;margin:8px 0 5px;color:var(--navy)}
.identity-hero p{font-size:12px;color:var(--muted);margin:0}
.identity-question{margin:27px 0 12px;text-align:right}
.identity-question h2{margin:0;font-size:20px}
.identity-question p{margin:2px 0 0;color:var(--muted);font-size:11px}
.identity-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.identity-card{border:1px solid var(--line);background:#fff;border-radius:20px;padding:18px;text-align:right;box-shadow:var(--shadow-sm);transition:.2s}
.identity-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#d9c4b8}
.identity-card .track-icon{margin-bottom:11px}
.identity-card h3{font-size:16px;margin:0 0 4px}
.identity-card p{font-size:10.8px;color:var(--muted);margin:0 0 12px;min-height:42px}
.identity-card .enter{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding-top:10px;color:var(--copper3);font-size:10.8px;font-weight:900}
.home-cases{margin-top:16px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:20px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.home-cases b{font-size:13px}.home-cases span{font-size:10.5px;color:rgba(255,255,255,.66)}
.home-cases button{border:0;background:#fff;color:var(--navy);border-radius:11px;min-height:40px;padding:8px 12px;font-weight:900;font-size:10.5px}

.app{max-width:1180px;margin:0 auto 0 0;padding:0 24px 54px;margin-right:238px}
.hero{margin:20px 0 28px;min-height:500px;border-radius:34px;overflow:hidden;position:relative;background:
linear-gradient(120deg,rgba(8,45,54,.99),rgba(15,69,82,.95));
box-shadow:var(--shadow)}
.hero:before{content:"";position:absolute;inset:0;background:
radial-gradient(circle at 80% 15%,rgba(215,139,97,.23),transparent 28%),
linear-gradient(120deg,transparent 0 58%,rgba(255,255,255,.035) 58% 59%,transparent 59% 100%)}
.hero:after{content:"";position:absolute;left:-80px;bottom:-165px;width:430px;height:430px;border:70px solid rgba(255,255,255,.045);border-radius:50%}
.hero-grid{min-height:500px;display:grid;grid-template-columns:1.03fr .97fr;position:relative;z-index:1}
.hero-copy{padding:54px 46px 44px;color:#fff;display:flex;flex-direction:column;justify-content:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;color:#efb28d;font-size:12px;font-weight:900}
.eyebrow:before{content:"";width:24px;height:2px;background:var(--copper2);border-radius:4px}
.hero h1{font-size:45px;line-height:1.38;margin:12px 0 11px;letter-spacing:-1.1px}
.hero p{max-width:680px;margin:0;color:rgba(255,255,255,.76);font-size:14px}
.hero-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}
.btn{border:0;border-radius:13px;min-height:46px;padding:10px 16px;font-weight:900;font-size:12px;transition:.2s transform,.2s box-shadow,.2s background}
.btn:hover{transform:translateY(-1px)}
.btn-light{background:#fff;color:var(--navy);box-shadow:0 10px 22px rgba(0,0,0,.09)}
.btn-copper{background:var(--copper);color:#fff}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18)}
.hero-visual{position:relative;min-height:500px;overflow:hidden}
.mine-sky{position:absolute;inset:0;background:
linear-gradient(180deg,rgba(255,180,113,.07),transparent 40%),
radial-gradient(circle at 75% 20%,rgba(255,187,126,.36),transparent 18%)}
.mountain{position:absolute;bottom:0;background:#123c45;clip-path:polygon(0 100%,16% 56%,33% 69%,49% 39%,62% 58%,77% 33%,100% 63%,100% 100%)}
.mountain.back{left:0;right:-6%;height:67%;opacity:.75}
.mountain.front{left:-10%;right:0;height:51%;background:#0b343d;opacity:.98;clip-path:polygon(0 100%,11% 58%,24% 73%,41% 45%,58% 67%,71% 43%,87% 61%,100% 50%,100% 100%)}
.road{position:absolute;bottom:-13%;left:19%;width:58%;height:66%;background:linear-gradient(90deg,rgba(194,133,92,.16),rgba(255,255,255,.14),rgba(194,133,92,.17));clip-path:polygon(44% 0,59% 0,100% 100%,0 100%);transform:rotate(-4deg);filter:blur(.2px)}
.truck{position:absolute;bottom:18%;right:20%;width:146px;height:78px}
.truck-body{position:absolute;right:0;bottom:22px;width:103px;height:42px;border-radius:8px 5px 4px 4px;background:linear-gradient(145deg,#f0f2ef,#cbd4d1);box-shadow:0 12px 24px rgba(0,0,0,.20)}
.truck-cab{position:absolute;left:1px;bottom:22px;width:47px;height:52px;border-radius:10px 5px 3px 4px;background:linear-gradient(145deg,#fff,#cbd4d1)}
.truck-cab:after{content:"";position:absolute;left:7px;top:8px;width:24px;height:13px;background:#315660;border-radius:4px}
.wheel{position:absolute;bottom:6px;width:25px;height:25px;border-radius:50%;background:#101b1e;border:6px solid #28373a}
.w1{right:15px}.w2{right:57px}.w3{left:14px}
.truck-logo{position:absolute;right:19px;top:9px;font-weight:900;color:var(--copper3);font-size:9px}
.hero-stat{position:absolute;left:28px;bottom:28px;width:220px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);color:#fff;border-radius:18px;padding:14px}
.hero-stat strong{display:block;font-size:12px;margin-bottom:3px}
.hero-stat span{font-size:10.5px;color:rgba(255,255,255,.68)}
.section{margin:30px 0}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:14px}
.section-head h2{font-size:25px;line-height:1.45;margin:0}
.section-head p{margin:2px 0 0;color:var(--muted);font-size:12px}
.section-tag{font-size:10.5px;border-radius:99px;padding:5px 10px;background:#fff;border:1px solid var(--line);color:var(--muted)}
.track-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.track-card{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:24px;padding:19px;box-shadow:var(--shadow-sm);transition:.2s transform,.2s box-shadow,.2s border-color}
.track-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#d5c2b6}
.track-card:after{content:"";position:absolute;left:-35px;top:-35px;width:110px;height:110px;border:21px solid rgba(183,101,56,.06);border-radius:50%}
.track-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:var(--soft-copper);color:var(--copper);font-size:23px;margin-bottom:13px}
.track-card h3{font-size:19px;margin:0 0 4px}
.track-card p{font-size:11.5px;color:var(--muted);margin:0 0 14px;min-height:64px}
.meta-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:15px}
.chip{font-size:10.5px;border:1px solid var(--line);background:#f9faf8;border-radius:99px;padding:4px 8px;color:#66767b}
.track-action{display:flex;align-items:center;justify-content:space-between;border-top:1px dashed var(--line);padding-top:11px;color:var(--navy);font-size:11.5px;font-weight:900}
.arrow{font-size:16px;color:var(--copper)}
.principles{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.principle{background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px}
.principle b{font-size:11.5px;display:block}
.principle span{display:block;color:var(--muted);font-size:10.5px;margin-top:2px}
.page-hero{margin:20px 0 18px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:28px;padding:27px;position:relative;overflow:hidden}
.page-hero:after{content:"";position:absolute;left:-65px;bottom:-115px;width:260px;height:260px;border:45px solid rgba(255,255,255,.05);border-radius:50%}
.breadcrumb{font-size:10.5px;color:rgba(255,255,255,.65);display:flex;gap:6px;align-items:center;position:relative;z-index:1}
.breadcrumb button{border:0;background:transparent;color:inherit;padding:0}
.page-hero h1{font-size:31px;line-height:1.45;margin:7px 0 6px;position:relative;z-index:1}
.page-hero p{font-size:12px;color:rgba(255,255,255,.76);margin:0;max-width:760px;position:relative;z-index:1}
.page-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px;position:relative;z-index:1}
.page-meta span{font-size:10.5px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);border-radius:99px;padding:4px 9px}
.session-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.session-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:.2s}
.session-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.session-card:before{content:"";position:absolute;right:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--copper),var(--copper2))}
.session-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.session-no{width:40px;height:40px;border-radius:13px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:900}
.status{font-size:9.8px;border-radius:99px;padding:4px 8px;background:#f1f5f3;color:#587069}
.status.viewed{background:#e8f3ed;color:var(--success)}
.session-card h3{font-size:16px;line-height:1.65;margin:12px 0 5px}
.session-card p{font-size:11px;color:var(--muted);margin:0 0 10px;min-height:43px}
.session-info{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.session-info span{font-size:10px;color:#6d7b80;background:#f6f8f6;border-radius:8px;padding:3px 7px}
.session-link{width:100%;border:0;background:var(--soft-copper);color:var(--copper3);font-weight:900;border-radius:12px;min-height:42px;font-size:11px}
.session-detail{display:grid;grid-template-columns:1fr 310px;gap:14px;align-items:start}
.content-card,.side-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow-sm)}
.content-card h2{font-size:21px;margin:0 0 8px}
.content-card p{font-size:12px;color:#536a71;margin:0 0 13px}
.topic-list{display:grid;gap:7px;margin-top:10px}
.topic{display:flex;gap:9px;align-items:flex-start;background:#f7f9f7;border-radius:13px;padding:9px 10px;font-size:11.5px}
.topic i{font-style:normal;width:25px;height:25px;border-radius:8px;background:var(--soft-copper);color:var(--copper);display:grid;place-items:center;flex:0 0 25px;font-weight:900}
.key-message{margin-top:13px;background:linear-gradient(135deg,#f8ede6,#fff);border:1px solid #ecd4c6;border-radius:15px;padding:12px;color:#70472f;font-size:11.5px}
.key-message b{color:var(--copper3)}
.side-card h3{font-size:14px;margin:0 0 9px}
.side-card .big{font-size:29px;font-weight:900;color:var(--navy);line-height:1.3}
.side-card p{font-size:10.8px;color:var(--muted)}
.side-actions{display:grid;gap:7px;margin-top:12px}
.side-actions button{border:0;border-radius:11px;min-height:42px;font-weight:900;font-size:10.8px}
.complete-btn{background:var(--navy);color:#fff}
.back-btn{background:var(--soft);color:var(--navy)}
.ops-timeline{display:grid;gap:9px}
.ops-block{background:#fff;border:1px solid var(--line);border-radius:19px;padding:14px;display:grid;grid-template-columns:86px 1fr;gap:13px;align-items:start;box-shadow:var(--shadow-sm)}
.ops-time{background:var(--navy);color:#fff;border-radius:13px;padding:9px 7px;text-align:center;font-weight:900;font-size:11px}
.ops-block h3{font-size:14.5px;margin:0 0 3px}
.ops-block p{font-size:11px;color:var(--muted);margin:0}
.ops-block ul{margin:7px 0 0;padding-right:17px;color:#50676e;font-size:10.8px}
.ops-block.break{background:linear-gradient(135deg,#f7ece5,#fff)}
.ops-block.break .ops-time{background:var(--copper)}
.case-category{margin:18px 0 28px}
.case-category-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.case-category-head h3{margin:0;font-size:17px;color:var(--navy)}
.case-category-head span{font-size:10px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:99px;padding:4px 8px}
.case-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.case-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow-sm);display:flex;gap:11px;align-items:flex-start;transition:.2s}
.case-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#d7c2b6}
.case-num{width:38px;height:38px;flex:0 0 38px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:900;font-size:12px}
.case-copy{min-width:0;flex:1}
.case-copy b{display:block;font-size:13px;line-height:1.65;margin-bottom:2px}
.case-copy small{display:block;color:var(--muted);font-size:10.5px}
.case-open{margin-top:8px;color:var(--copper3);font-weight:900;font-size:10.5px}
.case-pattern{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.pattern-card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:16px;box-shadow:var(--shadow-sm)}
.pattern-label{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.pattern-icon{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--soft-copper);color:var(--copper3);font-weight:900}
.pattern-label b{font-size:13px;color:var(--navy)}
.pattern-card p{margin:0;color:#52686f;font-size:11.5px;line-height:1.9}
.pattern-card.problem{border-right:4px solid #a64b3b}
.pattern-card.lesson{border-right:4px solid #2f6f7d}
.pattern-card.note{border-right:4px solid #c0892f}
.pattern-card.solution{border-right:4px solid #3c765b}
.case-nav-row{display:flex;gap:8px;justify-content:space-between;margin-top:14px}
.case-nav-row button{border:0;border-radius:11px;min-height:42px;padding:8px 13px;font-weight:900;font-size:10.5px}
.case-nav-row .prevnext{background:#fff;border:1px solid var(--line);color:var(--navy)}
.case-nav-row .allcases{background:var(--navy);color:#fff}
@media(max-width:680px){.case-grid,.case-pattern{grid-template-columns:1fr}}
.footer{margin-top:32px;border-top:1px solid var(--line);padding:23px 0 0;display:flex;justify-content:space-between;gap:15px;align-items:center;color:var(--muted);font-size:10.5px}
.footer b{color:var(--navy)}
.mobile-nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.mobile-nav-in{display:grid;grid-template-columns:repeat(5,1fr)}
.mobile-nav button{border:0;background:transparent;color:#728085;padding:7px 2px;min-height:58px;font-size:9.5px}
.mobile-nav button span{display:block;font-size:18px;line-height:1.2}
.mobile-nav button.active{color:var(--copper);font-weight:900}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:.25;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(min-width:681px){.topbar{display:none}.mobile-nav{display:none!important}}
@media(max-width:900px){
 .hero-grid{grid-template-columns:1fr}.hero-visual{min-height:300px}.hero,.hero-grid{min-height:0}
 .hero-copy{padding:38px 29px 32px}.hero h1{font-size:36px}
 .track-grid{grid-template-columns:1fr}.principles{grid-template-columns:1fr 1fr}
 .session-detail{grid-template-columns:1fr}
}
@media(max-width:680px){
 .dashboard-sidebar{display:none}.identity-grid{grid-template-columns:1fr}.identity-hero{padding:24px 18px}.identity-hero h1{font-size:27px}.home-cases{align-items:flex-start;flex-direction:column}.app{margin-right:0;padding:0 12px 36px}
 body{padding-bottom:72px}.topbar-in{padding:8px 13px}.desktop-nav,.top-pill{display:none}.brand-copy b{font-size:12px}.brand-copy small{font-size:9.5px}
 .hero{margin-top:11px;border-radius:24px}.hero-copy{padding:29px 20px 25px}.hero h1{font-size:29px;letter-spacing:-.5px}
 .hero p{font-size:12px}.hero-visual{min-height:250px}.truck{right:16%;transform:scale(.85)}
 .section{margin:24px 0}.section-head{align-items:flex-start}.section-head h2{font-size:21px}.section-tag{display:none}

var CASES=[{"id":1,"title":"از سازمان کوچک و غیررسمی تا سازمان حرفه‌ای","concept":"Professionalization · حرفه‌ای‌شدن","evidence":"دو درخواست مشابه حمل یا پشتیبانی را در دو سایت مقایسه کنید: مسیر ثبت، تأیید، تغییر و بستن کار کجا متفاوت است؟","variants":{"managers":{"problem":"در یک سناریوی آموزشی، مدیر ستاد با تماس تلفنی درخواست خودرو را تأیید می‌کند؛ سایت دیگر همان درخواست را با پیام شخصی جلو می‌برد. با افزایش مأموریت‌ها، ظرفیت یک خودرو به دو کار وعده داده می‌شود. هر مدیر می‌گوید روش قبلی سریع‌تر بود؛ اما کسی تصویر مشترکی از تعهدات ندارد.","analysis":"فرضیه ریشه‌ای، عقب‌ماندن سازوکار هماهنگی از رشد عملیات است. دانش افراد باتجربه به قاعده مشترک تبدیل نشده و اختیار تأیید با ثبت ظرفیت پیوند ندارد. پیش از نتیجه‌گیری، مسیر واقعی دو درخواست و دفعات تغییر برنامه را بررسی کنید؛ مسئله را صرفاً به بی‌نظمی افراد نسبت ندهید.","lesson":"Professionalization یعنی حداقل نظم لازم برای هماهنگی چند سایت، همراه با حفظ تجربه و چابکی افراد.","note":"شاخص موفقیت، فرم بیشتر نیست؛ تعهد متعارض و دوباره‌کاری کمتر است.","solution":["مدیر عملیات با نماینده ستاد و سایت، در هفته اول یک درخواست حمل را از ابتدا تا پایان ترسیم کند.","برای آزمایش یک‌هفته‌ای، شناسه درخواست، مسئول تأیید ظرفیت، نسخه نهایی برنامه و جانشین مسئول را مشخص کنید.","پس از آزمایش، تعداد تخصیص‌های متعارض و تماس‌های رفع ابهام را با هفته قبل مقایسه و رویه را اصلاح کنید."],"questions":["کدام رویه غیررسمی هنوز ارزشمند است و کدام بخش باید مشترک شود؟","حداقل تغییری که تعارض ظرفیت را کم کند چیست؟"]},"hq":{"problem":"دو سایت درخواست قطعه مشابه می‌فرستند؛ یکی تلفنی و دیگری در یک پیام گروهی. شما درخواست دوم را ثبت می‌کنید و تصور می‌کنید اولی را همکارتان انجام داده است. سایت اول پیگیری می‌کند و هیچ‌کس شماره درخواست یا آخرین وضعیت را ندارد.","analysis":"کانال‌های متعدد، تحویل نامشخص بین همکاران و اطلاعات ناقص، کار را به حافظه افراد وابسته کرده است. برای روشن‌شدن ریشه، زمان دریافت، پاسخ اولیه و تحویل به همکار را روی یک نمونه واقعی بازسازی کنید؛ شاید مسئله کمبود اطلاعات باشد، نه کم‌کاری.","lesson":"Ownership از ثبت روشن درخواست شروع می‌شود و با اطلاع‌دادن نتیجه به درخواست‌کننده کامل می‌شود.","note":"ثبت مختصر باید به پاسخ سریع‌تر کمک کند.","solution":["از همین هفته برای درخواست دریافتی، موضوع، سایت، زمان نیاز و مسئول پیگیری را در ابزار مورد تأیید واحد ثبت کنید.","اگر درخواست شفاهی است، خلاصه آن را برای تأیید درخواست‌کننده بازگو کنید و شماره پیگیری بدهید.","در پایان هفته با سرپرست، درخواست‌های بدون مسئول یا بدون پاسخ نهایی را مرور کنید؛ خروجی مطلوب کاهش موارد بلاتکلیف است."],"questions":["حداقل چه اطلاعاتی لازم است تا همکارتان بتواند کار را ادامه دهد؟","چه زمانی یک درخواست را واقعاً بسته‌شده می‌دانید؟"]},"operations":{"problem":"فرض کنید دیروز زمان حرکت را تلفنی گفته‌اند و امروز در پیام گروهی زمان دیگری دیده‌اید. همکار قدیمی می‌گوید: «همان ساعت دیروز برو.» شما نمی‌دانید کدام برنامه معتبر است و ممکن است به محل بارگیری برسید اما نوبت شما نباشد.","analysis":"چند پیام داریم، اما برنامه نهایی و فرد پاسخگو روشن نیست. این همیشه تقصیر راننده یا ستاد نیست؛ باید معلوم شود تغییر را چه کسی اعلام و چه کسی دریافت کرده است.","lesson":"قبل از حرکت، آخرین برنامه را با مسئول تعیین‌شده تأیید کنید.","note":"عادت قدیمی جای برنامه تأییدشده را نمی‌گیرد.","solution":["در زمان توقف ایمن بپرسید: «برنامه نهایی من کدام است و چه کسی آن را تأیید کرده؟»","زمان، محل و کار تعیین‌شده را با زبان خودتان تکرار کنید تا برداشت مشترک شود.","اگر دو دستور متفاوت دارید، قبل از اقدام از مسئول شیفت رفع ابهام بخواهید؛ در مرور پایان شیفت بگویید تعارض چگونه حل شد."],"questions":["اگر دو زمان حرکت متفاوت بشنوید، اولین کارتان چیست؟","چه کسی باید برنامه نهایی را برای شما روشن کند؟"]}}},{"id":2,"title":"دور زدن مدیر و مسیرهای غیررسمی","concept":"Escalation · ارجاع مسئولانه","evidence":"در نمونه ارجاع به مقام بالاتر، علت، زمان پاسخ مدیر مستقیم و نحوه اطلاع‌رسانی تصمیم را مشخص کنید؛ مسیر گزارش تخلف را جداگانه بررسی کنید.","variants":{"managers":{"problem":"مدیر سایت برای تأمین فوری یک خدمت، مستقیماً از مقام بالاتر قول می‌گیرد. مدیر مسئول بودجه بعداً متوجه تعهد می‌شود و می‌گوید امکان اجرای آن نیست. در سوی دیگر، کارمندی درباره رفتار نامناسب مدیر مستقیمش فقط به همان مدیر ارجاع داده می‌شود و سکوت می‌کند.","analysis":"دو نیاز متفاوت مخلوط شده‌اند: ارجاع کار به علت تأخیر و گزارش مستقل درباره خطر یا تخلف. نبود زمان پاسخ، مسیر جانشین و مرجع بی‌طرف، هم دورزدن مسئولیت را تقویت می‌کند و هم صدای کارکنان را می‌بندد.","lesson":"Escalation باید سرعت و پاسخگویی را هم‌زمان تقویت کند؛ گزارش خطر یا تخلف به اجازه فرد مورد گزارش وابسته نیست.","note":"دسترسی باز، مجوز ایجاد تعهد خارج از اختیار نیست.","solution":["مدیران در هفته اول سه مسیر را روشن کنند: کار عادی، موضوع فوری و گزارش مستقل خطر/تخلف.","برای کار عادی و فوری، زمان پاسخ پیشنهادی و جانشین را متناسب با ریسک توافق کنید؛ تعهد مالی فقط با تأیید صاحب اختیار باشد.","در مرور هفتگی، ارجاع‌های ناشی از بی‌پاسخی را بشمارید و علت را اصلاح کنید؛ اطلاعات گزارش حساس فقط به مرجع مجاز برسد."],"questions":["چه زمانی ارجاع به بالا ضروری است؟","چگونه مانع شویم حفظ سلسله‌مراتب، گزارش رفتار نامناسب را مسدود کند؟"]},"hq":{"problem":"شما منتظر تأیید درخواست یک سایت هستید. درخواست‌کننده می‌گوید: «با مدیر بالاتر هماهنگ کردم، ثبت لازم نیست.» همکار دیگری برای گزارش برخورد توهین‌آمیز مدیرش از شما راهنمایی می‌خواهد. هر دو موضوع فوری به نظر می‌رسند، اما مسیرشان یکسان نیست.","analysis":"درخواست عملیاتی به تصمیم قابل ردیابی نیاز دارد؛ گزارش رفتار نامناسب به مسیر مستقل و محرمانه. اگر هر دو را صرفاً دورزدن مدیر بنامیم، هم تعهد مبهم می‌شود و هم اعتماد آسیب می‌بیند.","lesson":"موضوع، دلیل ارجاع و مرجع دارای اختیار را روشن کنید.","note":"گزارش حساس را در گروه عمومی بازنشر نکنید.","solution":["برای درخواست اجرایی، تأیید صاحب اختیار و خلاصه تصمیم را در مسیر مصوب بخواهید.","در صورت بی‌پاسخی، با ذکر زمان درخواست و اثر تأخیر، به جانشین یا سطح تعیین‌شده ارجاع دهید.","برای گزارش رفتار نامناسب، فرد را به مرجع مستقل موجود راهنمایی کنید؛ اگر مسیر روشن نیست از مرجع مجاز بخواهید روشنش کند، بدون انتشار جزئیات."],"questions":["چطور محترمانه تأیید تصمیم را درخواست می‌کنید؟","در کدام وضعیت نباید اطلاع‌دادن به مدیر مستقیم شرط ارجاع باشد؟"]},"operations":{"problem":"در برنامه شما یک مأموریت مشخص شده؛ فردی از واحد دیگر تماس می‌گیرد و می‌گوید اول کار او را انجام دهید. هم‌زمان ممکن است درباره یک خطر جدی از مسئول مستقیم پاسخ نگیرید. آیا هر بار باید از همان مسیر قبلی منتظر بمانید؟","analysis":"تغییر برنامه عادی باید با مسئول تعیین‌شده هماهنگ شود. خطر فوری یا گزارش آزار، مسیر ایمنی یا گزارش مستقل خودش را دارد و نباید در انتظار اجازه فرد مورد گزارش بماند.","lesson":"برای تغییر کار هماهنگ کنید؛ برای خطر جدی از مسیر اضطراری مصوب کمک بگیرید.","note":"نام مقام بالاتر، ابهام دستور را برطرف نمی‌کند.","solution":["در توقف ایمن بگویید: «برای تغییر برنامه باید مسئول شیفت تأیید کند.»","در خطر فوری طبق آموزش و طرح اضطراری سایت عمل کنید و از مرجع ایمنی تعیین‌شده کمک بخواهید.","اگر پاسخ نمی‌گیرید از جانشین یا مسیر مستقل معرفی‌شده استفاده کنید؛ بعداً زمان و موضوع گزارش را برای پیگیری نگه دارید."],"questions":["اگر فرد دیگری بخواهد برنامه شما را عوض کند، چه می‌گویید؟","اگر مسئول مستقیم پاسخ ندهد، مسیر بعدی تعیین‌شده شما چیست؟"]}}},{"id":3,"title":"قانون‌مداری و صمیمیت حرفه‌ای","concept":"Fairness · انصاف و مرز حرفه‌ای","evidence":"دو درخواست مشابه مرخصی، اضافه‌کار یا تخصیص مأموریت را از نظر معیار و دلیل استثنا، بدون نام افراد مقایسه کنید.","variants":{"managers":{"problem":"یک سرپرست می‌گوید برای حفظ رابطه با راننده باتجربه، نوبت مأموریت او را خارج از قاعده جابه‌جا کرده است. دیگری برای همان درخواست رد می‌شود. در ستاد هم یک همکار آشنا کارش را زودتر پیش می‌برد و کارکنان عدالت تصمیم‌ها را زیر سؤال می‌برند.","analysis":"صمیمیت مسئله نیست؛ استثنای بدون دلیل روشن و معیار نابرابر مسئله است. پیش از برچسب تبعیض، وضعیت واقعی دو درخواست را مقایسه کنید: نیاز، محدودیت، صلاحیت و اختیار تصمیم چه بوده است؟","lesson":"رابطه انسانی با معیار مشترک سازگار است؛ consistency به معنای نادیده‌گرفتن تفاوت شرایط نیست.","note":"استثنا باید دلیل مرتبط با کار و تأیید قابل دفاع داشته باشد.","solution":["مدیر مربوط در یک هفته معیار تخصیص مأموریت و رسیدگی به درخواست را با تیم روشن کند.","استثنا را با دلیل کاری، مرجع تأیید و مدت اعتبار ثبت کنید؛ اطلاعات شخصی افراد را عمومی نکنید.","در مرور ماهانه، درخواست‌های مشابه و دلایل تفاوت تصمیم را بی‌نام بررسی کنید؛ معیار ارزیابی، قابلیت توضیح تصمیم است."],"questions":["کدام تفاوت شرایط، تصمیم متفاوت را منصفانه می‌کند؟","چطور به همکار نزدیک خود پاسخ منفی حرفه‌ای می‌دهید؟"]},"hq":{"problem":"همکارتان می‌گوید صورت‌هزینه یک آشنا را زودتر بررسی کنید، در حالی که درخواست‌های کامل دیگری در صف‌اند. می‌خواهید رابطه خوبی داشته باشید، اما دیگران از شما درباره نوبت رسیدگی توضیح می‌خواهند.","analysis":"فشار رابطه شخصی، نبود صف شفاف و تعریف مبهم فوریت می‌تواند معیار کار را تغییر دهد. کامل‌بودن مدارک و اثر تأخیر را از آشنایی فرد جدا کنید.","lesson":"می‌توان گرم و محترمانه حرف زد و در عین حال از معیار مشترک پیروی کرد.","note":"لطف شخصی نباید هزینه پنهان برای همکار دیگر بسازد.","solution":["بگویید: «مدارک را با همان معیار همه بررسی می‌کنم؛ اگر فوریت کاری دارد دلیلش را ثبت کنیم.»","اولویت را بر اساس معیار مورد تأیید سرپرست جلو ببرید؛ خودتان استثنای تازه نسازید.","در پایان هفته، موارد خارج از صف و دلیل تأییدشان را با سرپرست مرور کنید تا تصمیم قابل توضیح باشد."],"questions":["برای حفظ رابطه و رعایت نوبت چه جمله‌ای می‌گویید؟","چه تفاوتی میان کمک به تکمیل مدارک و امتیاز ویژه وجود دارد؟"]},"operations":{"problem":"یکی از همکاران قدیمی می‌گوید: «با نگهبانی آشنا هستم؛ لازم نیست منتظر نوبت بمانیم.» شما می‌خواهید رابطه خوب بماند، اما می‌بینید دیگران طبق برنامه منتظرند. قاعده سایت هم مسیر مشخصی دارد.","analysis":"عجله و رودربایستی می‌تواند قاعده مشترک را کنار بزند. آشنایی فردی، اختیار تغییر نوبت یا الزامات ایمنی را ایجاد نمی‌کند.","lesson":"احترام به همکار یعنی رابطه خوب همراه با رعایت قاعده برای همه.","note":"«همیشه این کار را می‌کردیم» دلیل کافی نیست.","solution":["محترمانه بگویید: «بیایید از مسئول نوبت تأیید بگیریم تا حق کسی ضایع نشود.»","طبق برنامه و الزامات اعلام‌شده سایت عمل کنید؛ برای تغییر، از مسئول مجاز سؤال کنید.","اگر نوبت‌ها مبهم است، در پایان شیفت موضوع را بدون نام‌بردن و اتهام با سرپرست مطرح کنید."],"questions":["چطور بدون دعوا از قاعده مشترک دفاع می‌کنید؟","برای تغییر نوبت باید از چه کسی تأیید بگیرید؟"]}}},{"id":4,"title":"قول می‌دهیم؛ اما آیا انجام می‌دهیم؟","concept":"Follow-through · پیگیری تا نتیجه","evidence":"سه تعهد اخیر را بررسی کنید: مسئول، خروجی، موعد، هشدار تأخیر و تأیید دریافت نتیجه ثبت شده‌اند؟","variants":{"managers":{"problem":"در جلسه گفته می‌شود قطعه مورد نیاز ناوگان «تا فردا جور می‌شود». سایت بر اساس همین قول برنامه می‌چیند؛ اما خرید منتظر مشخصات فنی و مالی منتظر تأیید است. روز بعد خودرو همچنان آماده نیست و هر واحد می‌گوید کار خودش را انجام داده است.","analysis":"قول قبل از بررسی وابستگی‌ها داده شده و مسئول نتیجه نهایی مشخص نیست. شاخص فعالیت هر واحد با آماده‌به‌کارشدن واقعی ناوگان فرق دارد. مسیر تعهد را با زمان تأییدها و اطلاع‌دادن تأخیر بازسازی کنید.","lesson":"Accountability یعنی تعهد واقع‌بینانه، هشدار زودهنگام و closing the loop با گیرنده نتیجه.","note":"ارسال درخواست، معادل آماده‌شدن خودرو نیست.","solution":["در جلسه بعد برای هر تعهد یک مسئول نهایی، خروجی قابل قبول، موعد و تأییدکننده تعیین کنید.","مسئول نهایی پیش از قول، وابستگی فنی، خرید و مالی را بررسی کند؛ تغییر موعد را قبل از سررسید اطلاع دهد.","در review هفتگی، تعهدات به‌موقع بسته‌شده و موارد تأخیر بدون هشدار را مرور کنید؛ هدف اول ساختن خط مبناست."],"questions":["چه کسی باید آماده‌شدن واقعی خودرو را تأیید کند؟","کدام قول را باید مشروط به تأیید دیگری اعلام کرد؟"]},"hq":{"problem":"به سایت می‌گویید مدارک مأموریت امروز آماده می‌شود. هنگام پایان کار متوجه می‌شوید یک تأیید نرسیده؛ تصور می‌کنید سایت خودش متوجه تأخیر می‌شود. صبح بعد راننده برای دریافت مدارک مراجعه می‌کند و آماده نیست.","analysis":"تأخیر ممکن است خارج از اختیار شما باشد، اما روشن‌کردن وضعیت و هشدار زودهنگام در اختیار شماست. عبارت «در حال انجام است» زمان و قدم بعدی را معلوم نمی‌کند.","lesson":"قابل‌اتکا بودن یعنی هم انجام کار و هم مدیریت انتظار دیگران.","note":"اگر موعد تغییر کرد، سکوت نکنید.","solution":["هنگام قبول کار، خروجی و زمان قابل اتکا را با درخواست‌کننده روشن کنید.","به محض دیدن مانع بگویید: «تأیید نرسیده؛ تا ساعت توافق‌شده وضعیت بعدی را خبر می‌دهم.»","پس از تحویل، دریافت و قابل استفاده‌بودن مدارک را تأیید بگیرید؛ آخر هفته تعهدات باز را با سرپرست مرور کنید."],"questions":["برای اعلام تأخیر، چه اطلاعاتی باید بدهید؟","چگونه از دریافت نتیجه مطمئن می‌شوید؟"]},"operations":{"problem":"پایان شیفت می‌گویید: «موضوع نقص خودرو را به شیفت بعد می‌گویم.» بعد عجله می‌کنید و می‌روید. همکار بعدی از موضوع خبر ندارد و فکر می‌کند خودرو طبق روال آماده است.","analysis":"قول شفاهی بدون تحویل روشن فراموش می‌شود. گفتن موضوع به یک نفر هم کافی نیست اگر معلوم نباشد مسئول بعدی آن را دریافت کرده است.","lesson":"کاری را که قبول می‌کنید تا تحویل روشن به نفر بعد پیگیری کنید.","note":"نقص ایمنی را در حد یک قول برای بعد نگه ندارید.","solution":["نقص را مطابق رویه سایت همان موقع به مسئول مجاز گزارش کنید؛ وضعیت مجازبودن استفاده باید روشن شود.","در تحویل شیفت، موضوع، اقدام انجام‌شده و کار باقی‌مانده را بازگو کنید و تأیید دریافت بگیرید.","اگر نتوانستید تعهد را انجام دهید، پیش از رفتن به مسئول شیفت خبر دهید؛ در مرور بعدی بررسی کنید موضوع بی‌صاحب نمانده باشد."],"questions":["از کجا می‌فهمید همکار بعدی پیام را گرفته است؟","اگر مسئول در دسترس نباشد، قدم بعدی شما چیست؟"]}}},{"id":5,"title":"همکاری مدیرانی که با هم اختلاف دارند","concept":"Constructive conflict · اختلاف سازنده","evidence":"یک اختلاف را به موضوع تصمیم، اطلاعات مورد اختلاف، اثر عملیاتی و رفتارهای قابل مشاهده تفکیک کنید؛ انگیزه‌خوانی نکنید.","variants":{"managers":{"problem":"مدیر عملیات خواهان آماده‌سازی سریع خودروست و مدیر پشتیبانی می‌گوید اعتبار و قطعه در دسترس نیست. اختلاف به پیام‌های کنایه‌آمیز تبدیل می‌شود و کارکنان هر واحد از پاسخ به واحد دیگر طفره می‌روند. مسئله خودرو حل نشده، اما دو جبهه شکل گرفته است.","analysis":"تعارض درباره منابع و زمان، شخصی شده و به تیم‌ها سرایت کرده است. معیار موفقیت دو واحد متفاوت است و تصمیم‌گیر نهایی محدودیت‌ها روشن نیست. اختلاف حرفه‌ای را از رفتار تحقیرآمیز جدا کنید؛ مورد دوم نیازمند رسیدگی مستقل است.","lesson":"مدیر می‌تواند مخالف باشد و همچنان یک شریک قابل اتکا برای اجرای تصمیم مشترک بماند.","note":"تیم‌ها نباید هزینه اختلاف حل‌نشده مدیران را بپردازند.","solution":["دو مدیر با تسهیلگر، در جلسه کوتاه هدف مشترک، محدودیت قطعی و گزینه‌های قابل اجرا را روی یک صفحه بنویسند.","برای مورد جاری، تصمیم‌گیر مجاز، مسئول اقدام و موعد پاسخ را تعیین و یک پیام مشترک به تیم‌ها بدهند.","یک هفته بعد، زمان حل درخواست مشترک و موارد توقف ناشی از اختلاف را مرور کنند؛ اختلاف باقیمانده از مسیر توافق‌شده ارجاع شود."],"questions":["در این اختلاف، کدام بخش مسئله منابع و کدام بخش مسئله رفتار است؟","بدون توافق کامل، بر چه اقدام مشترکی می‌توان توافق کرد؟"]},"hq":{"problem":"به شما گفته می‌شود: «تا آن واحد جواب ما را ندهد، کارشان را انجام نده.» درخواست یک سایت به همکاری هر دو واحد وابسته است و شما بین وفاداری به مدیر و پاسخ به نیاز کار گیر کرده‌اید.","analysis":"اختلاف بالادستی به همکاری روزمره منتقل شده است. واکنش متقابل کار را قفل می‌کند؛ در عین حال شما اختیار حل اختلاف مدیران را ندارید. اطلاعات و بخش قابل انجام کار را از نزاع شخصی جدا کنید.","lesson":"همکاری حرفه‌ای را در محدوده اختیار ادامه دهید و مانع تصمیم را روشن ارجاع دهید.","note":"پیام‌رسان کنایه و اتهام بین دو واحد نشوید.","solution":["وضعیت را بی‌طرفانه ثبت کنید: کار آماده، وابستگی باقی‌مانده و اثر تأخیر بر سایت.","از سرپرست تعیین تکلیف بخواهید: «این بخش قابل انجام است؛ برای این تصمیم به تأیید شما نیاز داریم.»","پس از تصمیم، نتیجه را به طرف‌های مرتبط اطلاع دهید؛ در review هفتگی تعداد درخواست‌های متوقف‌شده را مطرح کنید."],"questions":["چه جمله‌ای موضوع را از شخص جدا می‌کند؟","کدام بخش کار را با اختیار فعلی می‌توانید جلو ببرید؟"]},"operations":{"problem":"دو مسئول درباره محل انجام کار اختلاف دارند. هر کدام می‌گوید دستور خودش را اجرا کنید و از دیگری انتقاد می‌کند. شما نمی‌دانید کار کجا انجام شود و نگرانید هر انتخابی باعث سرزنش شود.","analysis":"اختلاف باید در سطح مسئولان حل شود؛ شما نباید با حدس‌زدن بین دو دستور انتخاب کنید. دستور متعارض، به‌خصوص در کار پرریسک، نیازمند رفع ابهام پیش از اجراست.","lesson":"به جای طرف‌گرفتن، دستور واحد و روشن بخواهید.","note":"خبر و کنایه را از یک تیم به تیم دیگر نبرید.","solution":["بگویید: «دو دستور متفاوت دریافت کرده‌ام؛ لطفاً مسئول مجاز برنامه نهایی را روشن کند.»","تا تعیین تکلیف، وضعیت ایمن و رویه مصوب کار را رعایت کنید؛ خودسرانه برنامه را تغییر ندهید.","پس از هماهنگی، دستور نهایی را تکرار و تأیید کنید؛ پایان شیفت بگویید چه ابهامی باعث انتظار شد."],"questions":["چطور بدون جانبداری درخواست تعیین تکلیف می‌کنید؟","اگر اختلاف حل نشود، از چه مسیر تعیین‌شده‌ای کمک می‌گیرید؟"]}}},{"id":6,"title":"واحد تخصصی؛ مانع یا شریک حل مسئله؟","concept":"Internal partnership · شراکت تخصصی","evidence":"یک درخواست ردشده را بررسی کنید: محدودیت دقیق، اطلاعات ناقص و گزینه جایگزین چه بوده است؟ ردشدن همیشه نشانه مانع‌تراشی نیست.","variants":{"managers":{"problem":"سایت برای بازگرداندن یک خودرو به کار، درخواست خرید فوری می‌دهد. مالی می‌گوید مدارک ناقص است و فنی می‌گوید مشخصات قطعه تأیید نشده. عملیات این پاسخ‌ها را مانع‌تراشی می‌نامد و برای دورزدن کنترل‌ها دنبال رابطه شخصی می‌رود.","analysis":"هدف‌های محلی و نبود گفت‌وگوی مشترک می‌تواند واحد تخصصی را به دروازه رد درخواست تبدیل کند. در مقابل، نقص اطلاعات یا ریسک واقعی خرید هم ممکن است علت توقف باشد. زمان توقف، اطلاعات مورد نیاز و امکان گزینه ایمن را بررسی کنید.","lesson":"واحد تخصصی باید استاندارد را حفظ کند و مسیر عملی رسیدن به نتیجه را هم روشن سازد.","note":"پاسخ حرفه‌ای: محدودیت مشخص + اطلاعات لازم + گزینه قابل بررسی + موعد پاسخ.","solution":["مدیران عملیات، فنی و مالی در هفته اول یک درخواست متوقف را مشترک بررسی کنند و صاحب تصمیم را مشخص سازند.","برای درخواست مشابه، چک‌لیست حداقلی و زمان پاسخ متناسب با ریسک توافق کنند؛ مسیر فوری همچنان کنترل‌های ضروری داشته باشد.","بعد از دو هفته، برگشت درخواست به علت نقص اطلاعات و زمان تعیین تکلیف را مرور کنند؛ هدف، کاهش رفت‌وبرگشت بی‌نتیجه است."],"questions":["کدام کنترل ارزش ایجاد می‌کند و کدام مرحله تکراری است؟","واحد تخصصی چگونه هم‌زمان شریک حل مسئله و نگهبان استاندارد می‌ماند؟"]},"hq":{"problem":"درخواستی از سایت دریافت می‌کنید که مشخصات و تأیید لازم را ندارد. پاسخ می‌دهید: «طبق دستورالعمل امکان ندارد.» سایت دوباره تماس می‌گیرد و می‌گوید خودرو متوقف است؛ اما هنوز نمی‌داند دقیقاً چه چیزی باید بفرستد.","analysis":"پاسخ درستِ مقرراتی ممکن است برای اجرا ناکافی باشد. سایت به فهرست دقیق نقص، روش تکمیل و زمان پاسخ بعدی نیاز دارد. شما هم برای تصمیم معتبر به اطلاعات قابل اتکا نیاز دارید.","lesson":"از رد کلی به guidance قابل اجرا حرکت کنید.","note":"کمک‌کردن، به معنای تأیید خارج از اختیار نیست.","solution":["اثر توقف بر عملیات را بپرسید و اطلاعات ناقص را در یک پیام روشن فهرست کنید.","بگویید پس از تکمیل چه کسی و در چه زمان توافق‌شده‌ای پاسخ می‌دهد؛ گزینه‌های مجاز را با مسئول مربوط بررسی کنید.","همان درخواست را تا تعیین تکلیف پیگیری کنید و پایان هفته علت برگشت‌های مشابه را به سرپرست بازخورد دهید."],"questions":["چگونه «نمی‌شود» را به پاسخ مفید تبدیل می‌کنید؟","برای تصمیم این درخواست کدام اطلاعات واقعاً ضروری است؟"]},"operations":{"problem":"برای دریافت خدمت تعمیراتی مراجعه می‌کنید، اما گفته می‌شود مجوز یا شرح نقص کامل نیست. فکر می‌کنید تعمیرگاه نمی‌خواهد کمک کند و می‌خواهید مستقیم از یک آشنا بخواهید کار را انجام دهد.","analysis":"ممکن است کنترل لازم باشد یا روش درخواست روشن نباشد. قبل از قضاوت، بپرسید چه اطلاعاتی کم است. تعمیر یا اجازه استفاده از وسیله، تصمیم فرد مجاز فنی است.","lesson":"مسئله را دقیق بگویید و مسیر رفع مانع را روشن بخواهید.","note":"برای سریع‌شدن کار، از تأیید فنی عبور نکنید.","solution":["نشانه نقص، زمان مشاهده و وضعیت کار را دقیق به مسئول مربوط بگویید؛ درباره علت فنی حدس قطعی نزنید.","بپرسید: «چه چیزی کم است و برای تکمیلش به چه کسی مراجعه کنم؟»","تا روشن‌شدن وضعیت مجاز استفاده، طبق رویه سایت عمل کنید؛ از مسئول شیفت زمان خبر بعدی را بپرسید."],"questions":["چه اطلاعاتی به تعمیرکار کمک می‌کند مسئله را بفهمد؟","اگر درخواست شما رد شد، چه سؤال مشخصی می‌پرسید؟"]}}},{"id":7,"title":"تصمیم‌گیری بدون حضور ذی‌نفعان اصلی","concept":"Stakeholder involvement · مشارکت در تصمیم","evidence":"در یک تغییر برنامه اخیر، افراد دارای اطلاعات ضروری، تصمیم‌گیر نهایی، اجراکننده و دریافت‌کننده اطلاع را مشخص کنید.","variants":{"managers":{"problem":"در سناریو، ستاد زمان بارگیری را برای پاسخ به مشتری جلو می‌آورد؛ اما با سایت، تعمیرات و مسئول ایمنی درباره آمادگی هماهنگ نمی‌کند. راننده به مقصد می‌رسد و ظرفیت دریافت مهیا نیست. در مأموریت برون‌مرزی فرضی، همین خطا می‌تواند هماهنگی مدارک و نماینده مقصد را هم مختل کند.","analysis":"تصمیم از نظر ستاد سریع بوده، اما داده محدودیت‌های اجرا در آن غایب است. مشورت با همه لازم نیست؛ افراد دارای اطلاعات غیرقابل جایگزین باید پیش از نهایی‌سازی حاضر باشند. وجود مأموریت برون‌مرزی در شرکت، در این مثال یک فرض آموزشی است.","lesson":"کیفیت تصمیم از اطلاعات معتبر و قابلیت اجرا می‌آید؛ consultation به معنای رأی‌گیری همگانی نیست.","note":"خبرکردن افراد پس از تصمیم، جای مشورت پیش از تصمیم را نمی‌گیرد.","solution":["برای یک تغییر برنامه، مدیر عملیات با سایت، فنی/ایمنی و نماینده مشتری مرتبط، محدودیت‌ها را قبل از تصمیم روشن کند.","در تصمیم مکتوب، تصمیم‌گیر، مشورت‌دهنده، اجراکننده، زمان اجرا و نسخه معتبر برنامه مشخص باشد.","در هفته آزمایش، تغییرات ناشی از اطلاعات جامانده و دفعات انتظار در مقصد را مرور کنید؛ اگر فوریت واقعی بود، مرور پس از اقدام داشته باشید."],"questions":["در این تصمیم صدای چه کسی غایب است؟","چگونه مشورت ضروری را سریع و بدون جلسه طولانی انجام می‌دهید؟"]},"hq":{"problem":"پیش از صدور برنامه حمل، زمان را در فایل تغییر می‌دهید و فقط برای مدیر خود می‌فرستید. سایت، مسئول اسناد و همکار شیفت بعدی هنوز نسخه قبلی را دارند. در مثال فرضی حمل برون‌مرزی، نماینده مقصد هم از تغییر بی‌خبر می‌ماند.","analysis":"مشکل فقط ارسال پیام نیست؛ مالک نسخه، دریافت‌کنندگان ضروری و تأیید دریافت مشخص نشده‌اند. اگر تغییر روی کار دیگری اثر دارد، دیدن آن فرد در فرایند تصمیم ضروری است.","lesson":"هر تغییر را همراه با اثر آن بر کار دیگران مدیریت کنید.","note":"فایل تازه تا وقتی افراد لازم آن را نشناسند، برنامه مشترک نیست.","solution":["پیش از تغییر، افراد اثرپذیر و اطلاعات لازم را مشخص و موارد خارج از اختیار را به مسئول تصمیم ارجاع دهید.","نسخه نهایی را با زمان اعتبار و شرح تغییر، در کانال مصوب برای افراد ضروری ارسال کنید.","از دریافت‌کنندگان کلیدی تأیید بگیرید؛ هفته بعد موارد استفاده از نسخه قدیمی را با سرپرست بررسی کنید."],"questions":["چه کسانی باید قبل از تغییر نظر بدهند و چه کسانی فقط مطلع شوند؟","چطور مطمئن می‌شوید نسخه قبلی کنار گذاشته شده است؟"]},"operations":{"problem":"برنامه جدید به شما رسیده، اما شما می‌دانید در ساعت اعلام‌شده ورود به محل مورد نظر ممکن نیست. با خود می‌گویید: «ستاد حتماً می‌داند» و چیزی نمی‌گویید. بعد از رسیدن، منتظر می‌مانید و کار عقب می‌افتد.","analysis":"شما اطلاعات میدان را دارید که شاید در ستاد دیده نشده باشد. سکوت باعث می‌شود تصمیم با فرض نادرست ادامه پیدا کند؛ تغییر خودسرانه برنامه هم راه‌حل نیست.","lesson":"اطلاعاتی را که اجرای برنامه به آن وابسته است، زود به مسئول مربوط بگویید.","note":"بیان محدودیت واقعی، مخالفت بی‌دلیل با دستور نیست.","solution":["در توقف ایمن، محدودیت مشخص را بگویید: محل، زمان و دلیل قابل مشاهده.","از مسئول برنامه بخواهید تصمیم نهایی را با سایت هماهنگ و به شما اعلام کند.","تصمیم روشن‌شده را تکرار کنید و طبق آن عمل کنید؛ پایان شیفت بررسی کنید آیا اطلاع زودهنگام از انتظار جلوگیری کرد."],"questions":["کدام اطلاعات میدان ممکن است از دید ستاد پنهان مانده باشد؟","چطور بدون تغییر خودسرانه، برنامه را قابل اجرا می‌کنید؟"]}}},{"id":8,"title":"سازمانی که همیشه در وضعیت فوری است","concept":"Prioritization · اولویت‌بندی","evidence":"کارهای فوری یک هفته را بر اساس خطر واقعی، اثر توقف، زمان اطلاع و علت فوریت دسته‌بندی کنید؛ برای اعلام خطر فوری تأخیر ایجاد نکنید.","variants":{"managers":{"problem":"درخواست قطعه، پرداخت، برنامه حمل و جلسه ستاد همگی برچسب فوری دارند. کارکنان مرتب کار قبلی را رها می‌کنند. سفارش قابل پیش‌بینی دیر ثبت شده، اما تیم برای جبران آن تحت فشار تحویل قرار می‌گیرد و صدای هشدار میدان کمتر شنیده می‌شود.","analysis":"فوریت مزمن می‌تواند از برنامه‌ریزی ضعیف، ظرفیت ناکافی، تأییدهای کند یا پاداش‌دادن به آتش‌نشانی ناشی شود. همه تأخیرها رفتاری نیستند؛ داده زمان ایجاد نیاز تا ثبت درخواست و ظرفیت واقعی را بررسی کنید.","lesson":"مدیریت اولویت یعنی تصمیم روشن درباره ترتیب کار، منابع و کاری که موقتاً کنار گذاشته می‌شود.","note":"ایمنی و اعلام خطر، در صف اولویت اداری معطل نمی‌ماند.","solution":["مدیران در هفته اول معیارهای فوریت را با عملیات روشن کنند: خطر، توقف جدی یا موعد واقعی غیرقابل جابه‌جایی.","در هماهنگی کوتاه روزانه، برای هر کار تازه مشخص کنند کدام کار عقب می‌رود و چه کسی متأثر می‌شود.","پس از دو هفته، سهم فوریت‌های قابل پیش‌بینی و علت دیررسیدن درخواست را مرور کنند؛ هدف پیشنهادی را پس از خط مبنا تعیین کنند."],"questions":["کدام فوریت، نتیجه یک تصمیم قبلی خودمان است؟","برای پذیرش کار فوری جدید، کدام کار باید جابه‌جا شود؟"]},"hq":{"problem":"سه واحد هم‌زمان می‌گویند کارشان فوری است. برای راضی‌کردن همه، به هر سه قول امروز می‌دهید. با چند بار قطع کار، یک اشتباه در مدارک رخ می‌دهد و هیچ درخواست کاملی تحویل نمی‌شود.","analysis":"تعارض اولویت به فرد واگذار شده و ظرفیت واقعی دیده نشده است. بدون پرسیدن اثر تأخیر و زمان نیاز، صدای بلندتر جای معیار می‌نشیند.","lesson":"پیش از قول، priority و ظرفیت را با صاحب اختیار روشن کنید.","note":"پذیرفتن همه موعدها، تعهد حرفه‌ای نیست.","solution":["از هر درخواست‌کننده زمان نیاز، اثر تأخیر و کامل‌بودن ورودی را بپرسید؛ خطر فوری را مستقیم به مرجع مربوط منتقل کنید.","سه کار و ظرفیت موجود را به سرپرست نشان دهید و ترتیب و موعد قابل اتکا بخواهید.","اگر کار تازه اولویت گرفت، تغییر موعد را همان موقع به افراد قبلی خبر دهید؛ آخر هفته علت فوریت‌های تکراری را جمع‌بندی کنید."],"questions":["برای فهم فوریت واقعی چه دو سؤال می‌پرسید؟","وقتی ظرفیت کافی ندارید، چگونه انتظار را مدیریت می‌کنید؟"]},"operations":{"problem":"به شما می‌گویند بار باید زودتر برسد. مسیر و کارهای قبلی زمان برده و احساس خستگی می‌کنید. جمله «همه منتظرند» شما را تحت فشار قرار می‌دهد تا شرایط خودتان را پنهان کنید.","analysis":"فشار زمان می‌تواند گزارش خستگی یا محدودیت میدان را کم کند. زمان تحویل باید با شرایط واقعی و الزامات ایمنی هماهنگ شود؛ جبران تأخیر با رفتار پرخطر، راه‌حل نیست.","lesson":"محدودیت ایمنی را زود بگویید تا مسئول برنامه راه قابل اجرا پیدا کند.","note":"فوریت، مجوز رانندگی ناایمن نیست.","solution":["در محل و زمان ایمن، خستگی یا محدودیت مسیر را دقیق به مسئول شیفت گزارش کنید.","طبق دستورالعمل مصوب رانندگی و استراحت عمل کنید و برای برنامه جایگزین تعیین تکلیف بخواهید.","زمان برآوردشده معتبر را پس از هماهنگی اعلام کنید؛ در مرور شیفت بگویید فشار زمانی از کجا ایجاد شد."],"questions":["اگر برای رسیدن تحت فشار باشید و خسته باشید، چه می‌گویید؟","چه کسی باید تغییر برنامه را با مقصد هماهنگ کند؟"]}}},{"id":9,"title":"ایمنی؛ آموزش کافی است یا نظارت هم لازم است؟","concept":"Safety leadership · رهبری ایمنی","evidence":"به جای اتکا به تعداد کلاس، مشاهده کار، دسترسی به تجهیزات، فشار زمانی و بسته‌شدن اقدامات اصلاحی را بررسی کنید؛ نبود حادثه به‌تنهایی معیار کافی نیست.","variants":{"managers":{"problem":"در مثال آموزشی حمل مواد اسیدی، کارکنان آموزش دیده‌اند؛ اما هنگام فشار تحویل، بعضی کنترل‌های پیش از کار با عجله انجام می‌شود. مدیر فقط تعداد نفرات آموزش‌دیده را می‌پرسد و سرپرست از متوقف‌شدن کار نگران است.","analysis":"فرضیه فقط کمبود آگاهی نیست: زمان، تجهیزات مناسب، نظارت، صلاحیت و پیام پاداش عملکرد را بررسی کنید. توصیه‌های این کیس درباره مدیریت رفتار است؛ کنترل فنی و واکنش اضطراری باید طبق ارزیابی ریسک و دستورالعمل مصوب سایت باشد.","lesson":"رفتار ایمن با آموزش، شرایط اجرای مناسب، مشاهده و پاسخگویی پایدار می‌شود.","note":"اگر برای سرعت، عبور از کنترل تحمل شود، آموزش اثر خود را از دست می‌دهد.","solution":["مدیر عملیات با مسئول HSE، در هفته اول یک کار پرریسک را با مشارکت کارکنان مشاهده و مانع اجرای ایمن را شناسایی کند.","مسئول، موعد و شاهد رفع هر مانع را تعیین کنند؛ کنترل خطر بر آموزش مجدد صرف مقدم باشد.","در مرور هفتگی، اقدامات ایمنی باز، کیفیت کنترل پیش از کار و پاسخ به گزارش‌ها را بررسی کنند؛ گزارش بیشتر را خودکار نشانه عملکرد بد ندانند."],"questions":["افراد نمی‌دانند، نمی‌توانند یا برای اجرا تحت فشارند؟","رفتار کدام مدیر، پیام واقعی اولویت ایمنی را نشان می‌دهد؟"]},"hq":{"problem":"برای رعایت موعد مشتری، برنامه حمل را فشرده می‌کنید. از سایت خبر می‌رسد که کنترل ایمنی و آمادگی خودرو هنوز تکمیل نشده است. می‌خواهید فقط پیام «لطفاً سریع‌تر» بفرستید تا کار عقب نماند.","analysis":"تصمیم ستاد می‌تواند شرایط رفتار میدان را تغییر دهد. مسئول اداری نباید صلاحیت تأیید فنی یا ایمنی را برای خود فرض کند؛ باید وضعیت واقعی و مرجع آزادسازی کار را روشن سازد.","lesson":"پشتیبانی ایمن یعنی برنامه‌ای که انجام کنترل‌های لازم در آن ممکن باشد.","note":"تأیید اداری، جای تأیید فنی و ایمنی را نمی‌گیرد.","solution":["وضعیت آمادگی را از مرجع مجاز بپرسید و تا روشن‌شدن آن، آماده‌بودن را به مشتری وعده ندهید.","اثر تغییر زمان را به مسئول برنامه منتقل و گزینه قابل اجرای مورد تأیید را بررسی کنید.","هر هفته موارد تعارض زمان‌بندی با کنترل‌های ایمنی را با سرپرست مرور کنید؛ خروجی، اصلاح برنامه یا رفع مانع مشخص باشد."],"questions":["کدام تصمیم ستاد ممکن است رعایت ایمنی را سخت کند؟","تأیید آماده‌به‌کاربودن باید از چه مرجعی بیاید؟"]},"operations":{"problem":"در یک موقعیت آموزشی، پیش از شروع کار با خودرو یا محل بارگیری مورد مشکوکی می‌بینید. همکار می‌گوید: «دیروز هم همین بود؛ شروع کنیم.» شما آموزش دیده‌اید، اما نمی‌خواهید باعث تأخیر گروه شوید.","analysis":"عادی‌شدن وضعیت مشکوک و فشار همکار می‌تواند باعث سکوت شود. نبود حادثه قبلی دلیل ایمن‌بودن نیست. تشخیص و اجازه فنی باید از مسئول صلاحیت‌دار باشد.","lesson":"قبل از ادامه، وضعیت مشکوک را طبق رویه ایمنی روشن کنید.","note":"خودتان برای رفع نقص خطرناک اقدام فنی نکنید.","solution":["کار را در وضعیت ایمن نگه دارید و طبق آموزش و دستورالعمل مصوب، موضوع را فوری گزارش کنید.","نشانه مشاهده‌شده و محل را دقیق بگویید؛ در خطر اضطراری از مسیر اضطراری سایت استفاده کنید.","ادامه کار را به تعیین تکلیف مرجع مجاز وابسته کنید و در تحویل شیفت وضعیت را روشن تحویل دهید."],"questions":["در برابر «دیروز هم همین بود» چه پاسخی می‌دهید؟","چه کسی اجازه ادامه کار را طبق رویه صادر می‌کند؟"]}}},{"id":10,"title":"از کنترل شخصی تا نظم، نظارت و پاسخگویی","concept":"Management rhythm · نظم پیگیری","evidence":"تصمیم‌های متوقف در نبود مدیر و زمان صرف‌شده برای گزارش‌های تکراری را بررسی کنید؛ نظارت را فقط با تعداد تماس نسنجید.","variants":{"managers":{"problem":"مدیر برای اطمینان از کار سایت‌ها، درباره هر درخواست و هر جابه‌جایی تماس می‌گیرد. وقتی در جلسه است، تأییدهای کوچک هم می‌ماند. کارکنان یاد گرفته‌اند برای هر تصمیم منتظر او باشند و مشکلات مهم میان جزئیات گم می‌شود.","analysis":"کنترل فردی جای نقش روشن و سازوکار نظارت را گرفته است. ممکن است تجربه یا قابلیت تیم هم کافی نباشد؛ تفویض اختیار باید همراه با بررسی شایستگی، مرز تصمیم و پشتیبانی باشد.","lesson":"مدیر با معیار روشن و review منظم، مالکیت تیم را تقویت می‌کند.","note":"تفویض اختیار، حذف نظارت یا واگذاری تصمیم ایمنی به فرد فاقد صلاحیت نیست.","solution":["در هفته اول دو تصمیم پرتکرار و کم‌ریسک را برای واگذاری انتخاب و حدود اختیار و جانشین را مشخص کنید.","با تیم زمان review و موارد استثنایی نیازمند ارجاع را توافق کنید؛ گزارش کوتاه شامل وضعیت، مانع و تصمیم لازم باشد.","پس از دو هفته، تأخیر ناشی از انتظار مدیر و کیفیت تصمیم‌های واگذارشده را بررسی کنید؛ آموزش و مرز اختیار را اصلاح کنید."],"questions":["کدام تصمیم فقط از روی عادت به مدیر برمی‌گردد؟","چه شاهدی به شما امکان می‌دهد مداخله روزمره را کمتر کنید؟"]},"hq":{"problem":"برای یک درخواست، در چند فایل و پیام مختلف وضعیت می‌نویسید و هر بار تلفنی هم گزارش می‌دهید. وقتی مدیر نیست، نمی‌دانید کدام بخش کار را می‌توانید جلو ببرید. وقت گزارش‌دادن بیشتر شده، اما مانع حل نشده است.","analysis":"گزارش‌های موازی و حدود اختیار مبهم، هم فشار ایجاد می‌کند و هم اتکا به مدیر را بالا می‌برد. هدف گزارش باید تصمیم یا اقدام باشد، نه فقط نشان‌دادن مشغول‌بودن.","lesson":"یک وضعیت معتبر، یک مسئول و یک درخواست تصمیم روشن داشته باشید.","note":"خارج از اختیار عمل نکنید؛ داخل اختیار هم بی‌دلیل منتظر نمانید.","solution":["با سرپرست منبع واحد وضعیت کار و قالب کوتاه «انجام‌شده، مانع، قدم بعدی» را توافق کنید.","برای تصمیم‌های تکراری، حدود اختیار و زمان ارجاع را روشن بخواهید.","پایان هفته، کارهای منتظر تأیید و گزارش‌های تکراری را مرور کنید؛ خروجی، حذف یک تکرار یا روشن‌شدن یک اختیار باشد."],"questions":["گزارش شما باید کدام تصمیم را ممکن کند؟","در نبود مدیر، چه کاری طبق اختیار فعلی قابل انجام است؟"]},"operations":{"problem":"سرپرست مدام تماس می‌گیرد تا بداند کار کجاست. گاهی وسط کار یا رانندگی نمی‌توانید پاسخ دهید. از طرفی تغییر وضعیت را هم طبق زمان مشخصی خبر نمی‌دهید و او مجبور می‌شود دوباره پیگیری کند.","analysis":"زمان و روش گزارش توافق نشده است. پیگیری بی‌قاعده هم مزاحمت ایجاد می‌کند و هم ممکن است توجه را از کار ایمن بگیرد. لازم است وضعیت در نقاط مناسب و ایمن اعلام شود.","lesson":"گزارش روشن در زمان توافق‌شده، تماس‌های پراکنده را کمتر می‌کند.","note":"هنگام رانندگی یا کار نیازمند تمرکز، برای پاسخ‌دادن خود را در خطر قرار ندهید.","solution":["پیش از مأموریت با مسئول شیفت زمان و روش ایمن اعلام وضعیت را روشن کنید.","در زمان مناسب بگویید: «کار انجام‌شده، مانع فعلی و زمان خبر بعدی» چیست.","اگر برنامه تغییر کرد یا خطر پیش آمد، طبق مسیر مصوب گزارش دهید؛ پایان شیفت بررسی کنید کدام تماس‌های تکراری قابل حذف بود."],"questions":["چه زمانی برای گزارش وضعیت مناسب و ایمن است؟","گزارش کوتاه شما چه سه جزء دارد؟"]}}},{"id":11,"title":"رفتار مدیر؛ پیام فرهنگی سازمان","concept":"Role modelling · الگوسازی رفتاری","evidence":"در یک هفته، رفتار مشاهده‌پذیر مدیر در واکنش به تأخیر، خبر بد و رعایت قاعده را ثبت کنید؛ درباره شخصیت او قضاوت نکنید.","variants":{"managers":{"problem":"مدیر در جلسه بر احترام، دقت و ایمنی تأکید می‌کند؛ اما وقتی تأخیر پیش می‌آید، در جمع با سرپرست تند صحبت می‌کند و می‌گوید «فعلاً کار را راه بیندازید». کارکنان می‌بینند سرعت تحویل تشویق می‌شود، ولی گزارش مسئله با واکنش تند روبه‌روست.","analysis":"فاصله میان ارزش اعلام‌شده و رفتار تحت فشار، پیام فرهنگی دوگانه می‌سازد. باید رفتار دقیق، موقعیت و پیامد را بررسی کرد؛ یک مشاهده برای قضاوت درباره کل فرهنگ کافی نیست. فشار و کمبود منابع، رفتار نامناسب را توجیه نمی‌کند.","lesson":"Credibility مدیر از رفتار تکرارشونده، به‌ویژه هنگام فشار و شنیدن خبر بد، ساخته می‌شود.","note":"آنچه تحمل یا تشویق می‌کنید، بخشی از استاندارد واقعی تیم می‌شود.","solution":["هر مدیر در هفته اول سه رفتار قابل مشاهده انتخاب کند: شنیدن خبر بد بدون تحقیر، رعایت قاعده و پیگیری تعهد خودش.","پس از یک موقعیت دشوار، از همکاران با پرسش مشخص بازخورد بخواهد؛ امکان پاسخ خصوصی و بدون فشار فراهم باشد.","در review هفتگی یک نمونه رفتار و یک اصلاح را مرور کند؛ معیار، شاهد رفتاری است، نه صرفاً ادعای پایبندی به ارزش‌ها."],"questions":["تیم از واکنش شما به آخرین خبر بد چه چیزی یاد گرفت؟","کدام رفتار کوچک می‌تواند اعتبار پیام فرهنگی شما را بیشتر کند؟"]},"hq":{"problem":"مدیر از همه دقت می‌خواهد، اما یک بار می‌گوید اطلاعات تأییدنشده را برای سرعت بیشتر قطعی اعلام کنید. شما نگرانید مخالفت بی‌احترامی تلقی شود و همان عبارت قطعی را در پاسخ به سایت می‌نویسید.","analysis":"فشار مقام و میل به رضایت مدیر می‌تواند دقت حرفه‌ای را تضعیف کند. میان داده تأییدشده، برآورد و موضوع نامعلوم تفاوت بگذارید؛ قرار نیست با حدس، انتظار غلط ایجاد شود.","lesson":"Professional identity یعنی دقت و احترام را هم‌زمان نگه دارید.","note":"ابهام را محترمانه روشن کنید؛ آن را به قطعیت تبدیل نکنید.","solution":["بگویید: «این زمان هنوز تأیید نشده؛ می‌توانم آن را به‌صورت برآورد اعلام کنم؟»","تأیید مورد نیاز و مسئول آن را مشخص کنید و وضعیت معتبر را منتقل کنید.","اگر درخواست نادرست تکرار شد، از مسیر مجاز سازمان برای طرح نگرانی کمک بگیرید؛ در مرور کار، اثر اطلاعات تأییدنشده را بی‌نام بررسی کنید."],"questions":["چگونه بدون تقابل، دقت اطلاعات را حفظ می‌کنید؟","بین برآورد و تعهد قطعی چه تفاوتی در پیام شما هست؟"]},"operations":{"problem":"سرپرست در شروع شیفت می‌گوید همه باید قاعده سایت را رعایت کنند، اما وقتی عجله دارد خودش از آن عبور می‌کند. همکار تازه‌وارد می‌پرسد: «پس کدام را انجام بدهیم؛ حرفش یا کارش را؟»","analysis":"افراد تازه‌وارد از رفتار مسئول و همکار باتجربه یاد می‌گیرند. رفتار متفاوتِ یک نفر، قاعده مصوب را عوض نمی‌کند. برای روشن‌شدن انتظار باید از مسئول مجاز سؤال شود.","lesson":"رفتار حرفه‌ای را با قاعده روشن بسنجید، حتی اگر دیگری رعایت نکند.","note":"شما هم برای همکار تازه‌وارد الگو هستید.","solution":["قاعده و آموزش معتبر سایت را رعایت کنید و از رفتار پرخطر پیروی نکنید.","در زمان مناسب بپرسید: «برای اینکه درست انجام بدهم، روش تأییدشده این کار چیست؟»","خطر یا فشار برای تخلف را از مسیر مصوب گزارش دهید؛ پایان شیفت یک نمونه رفتار درست خودتان را مرور کنید."],"questions":["اگر حرف و رفتار مسئول متفاوت بود، معیار شما چیست؟","با رفتار خودتان به همکار جدید چه چیزی یاد می‌دهید؟"]}}},{"id":12,"title":"استخدام در سایت‌ها؛ چه کسی تصمیم می‌گیرد؟","concept":"Hiring governance · تصمیم روشن در جذب","evidence":"برای یک جذب اخیر، نیازسنجی، بودجه، ارزیابی شغلی، تأیید نهایی و آماده‌سازی شروع کار را دنبال کنید؛ اطلاعات شخصی داوطلب را در کلاس مطرح نکنید.","variants":{"managers":{"problem":"سایت برای پوشش کمبود نیرو، به یک فرد آشنا قول شروع کار می‌دهد. منابع انسانی بعداً متوجه می‌شود ارزیابی شغلی و تأیید ظرفیت انجام نشده است. عملیات می‌گوید کار معطل می‌ماند و ستاد می‌گوید مسئول پیامد استخدام نیست.","analysis":"نیاز واقعی ظرفیت با حق تصمیم و ارزیابی صلاحیت مخلوط شده است. کمبود نیرو، تأخیر در جذب و وعده خارج از اختیار را جدا بررسی کنید. مسئولیت انتخاب و احراز الزامات شغلی باید پیش از قول روشن باشد.","lesson":"Hiring یک فرایند مشترک است؛ هر مرحله باید صاحب تصمیم مشخص داشته باشد.","note":"معرفی فرد، تعهد استخدام یا تأیید صلاحیت نیست.","solution":["مدیر سایت، منابع انسانی و صاحب اختیار بودجه، در هفته اول یک مسیر حداقلی برای درخواست و تأیید جذب توافق کنند.","سایت نیاز و شرایط کار را تعریف کند؛ ارزیاب مجاز صلاحیت شغلی و الزامات مرتبط را بررسی کند؛ پیشنهاد استخدام فقط از مرجع مجاز صادر شود.","برای کمبود فوری، گزینه موقت مجاز و ایمن بررسی کنید؛ زمان جذب و موارد شروع کار پیش از تکمیل تأییدها را ماهانه مرور کنید."],"questions":["کدام تصمیم با سایت است و کدام به تأیید تخصصی یا بودجه نیاز دارد؟","چگونه نیاز فوری را بدون وعده خارج از اختیار پاسخ می‌دهید؟"]},"hq":{"problem":"فردی برای کار در سایت تماس می‌گیرد و می‌گوید با مسئول سایت توافق کرده است. پرونده او هنوز کامل نیست و شما نمی‌دانید باید معرفی‌نامه شروع کار صادر کنید یا منتظر تأیید بمانید. سایت هم برای سرعت فشار می‌آورد.","analysis":"قول شفاهی با تصمیم رسمی جذب یکسان فرض شده است. ابهام در مدارک، مرجع تأیید و اطلاع‌رسانی، هم تجربه داوطلب و هم برنامه سایت را مختل می‌کند.","lesson":"به داوطلب و سایت یک وضعیت معتبر و یک قدم بعدی روشن بدهید.","note":"خودتان وعده شروع کار یا نتیجه قطعی ارزیابی ندهید.","solution":["درخواست، عنوان شغل و مرجع معرفی را در مسیر مجاز ثبت و تأییدهای لازم را بررسی کنید.","نقص پرونده و مسئول قدم بعدی را دقیق به افراد مجاز اطلاع دهید؛ مدارک شخصی را در گروه عمومی نگذارید.","تا تصمیم مرجع مجاز، وضعیت را مشروط و روشن اعلام کنید؛ پایان هفته پرونده‌های بلاتکلیف و علت توقف را با مسئول جذب مرور کنید."],"questions":["چه چیزی باید قبل از معرفی‌نامه شروع کار روشن شود؟","چگونه محترمانه توضیح می‌دهید که معرفی، استخدام قطعی نیست؟"]},"operations":{"problem":"همکار تازه‌ای به شیفت معرفی شده است. یکی می‌گوید «راننده باتجربه‌ای است، زود کار را به او بدهیم»، اما معلوم نیست آشنایی با سایت، تجهیزات و مجوزهای لازم بررسی شده باشد. شما قرار است کار را به او تحویل دهید.","analysis":"تجربه قبلی با آمادگی برای همین کار و همین سایت یکسان نیست. احراز صلاحیت و اجازه شروع، مسئول مشخص دارد؛ همکار نباید بر اساس آشنایی شخصی آن را فرض کند.","lesson":"ورود همکار جدید با معرفی روشن، آموزش لازم و تعیین حدود کار همراه است.","note":"کمک کنید یاد بگیرد؛ کار خارج از صلاحیت به او نسپارید.","solution":["از مسئول شیفت بخواهید وظیفه مجاز و فرد راهنمای همکار جدید را روشن کند.","اطلاعات تحویل، مسیر گزارش و نکات مصوب سایت را طبق مسئولیت خود توضیح دهید و فهم او را بررسی کنید.","اگر تأیید لازم روشن نیست، موضوع را قبل از واگذاری کار به مسئول مجاز بگویید؛ در پایان شیفت ابهام‌های باقی‌مانده را مطرح کنید."],"questions":["قبل از سپردن کار به همکار جدید چه چیزی باید روشن باشد؟","از کجا می‌فهمید او مسیر گزارش مشکل را می‌داند؟"]}}},{"id":13,"title":"امنیت روانی و فیزیکی کارکنان","concept":"Psychological safety · امکان بیان نگرانی","evidence":"واکنش به آخرین گزارش نگرانی، زمان پاسخ و اقدام بعدی را بررسی کنید. کم‌شدن گزارش لزوماً به معنای کم‌شدن خطر نیست؛ نام و روایت حساس را در جمع ثبت نکنید.","variants":{"managers":{"problem":"در جلسه گفته می‌شود مشکل مهمی وجود ندارد. در گفت‌وگوی خصوصی، کارکنان از ترس تحقیر یا از دست‌دادن مأموریت، درباره خستگی، نقص و برخورد نامناسب حرف می‌زنند. مدیر، سکوت جمع را نشانه رضایت و نبود خطر برداشت کرده است.","analysis":"سکوت می‌تواند از ترس واکنش، بی‌فایده‌دیدن گزارش یا نامشخص‌بودن مسیر ناشی شود؛ این‌ها فرضیه‌اند و باید با گفت‌وگوی امن و شواهد بررسی شوند. امنیت روانی یعنی امکان طرح سؤال و نگرانی، همراه با پاسخگویی منصفانه؛ به معنای حذف استاندارد نیست.","lesson":"مدیر باید هم شنیدن نگرانی را ممکن کند و هم رفع خطر و پیگیری منصفانه را سازمان دهد.","note":"وعده محرمانگی مطلق ندهید؛ حدود دسترسی و رسیدگی را روشن توضیح دهید.","solution":["مدیریت با مرجع ایمنی و منابع انسانی، مسیر خطر فوری و مسیر مستقل گزارش رفتار نامناسب را روشن و قابل دسترس کند.","در دریافت گزارش، تشکر، پرسش بدون اتهام و اقدام بعدی روشن داشته باشید؛ از تلافی‌جویی جلوگیری و دسترسی به اطلاعات را محدود کنید.","در review دوره‌ای، زمان پاسخ و بسته‌شدن اقدام را بسنجید؛ افزایش گزارش را بدون بررسی، شکست ایمنی تلقی نکنید."],"questions":["کارکنان از آخرین واکنش شما چه انتظاری درباره گزارش بعدی ساخته‌اند؟","چه چیزی نشان می‌دهد مسیر گزارش فقط روی کاغذ نیست؟"]},"hq":{"problem":"همکار می‌گوید از برخورد توهین‌آمیز یا فشار برای پنهان‌کردن یک مشکل ناراحت است. برای همدلی می‌خواهید پیام او را در گروه بفرستید تا همه مطلع شوند. اما او از پیامدهای بعدی نگران است.","analysis":"حمایت به معنای انتشار روایت فرد نیست. نیاز فوری به حفاظت، مسیر رسیدگی و خواست فرد را روشن کنید؛ خودتان نقش بازپرس یا درمانگر نگیرید و قول نتیجه قطعی ندهید.","lesson":"Support یعنی شنیدن محترمانه، حفظ اختیار فرد و راهنمایی به مسیر مناسب.","note":"پیگیری خطر فوری را با رسیدگی اداری معمول یکی نکنید.","solution":["در فضای مناسب گوش دهید و بپرسید نگرانی فعلی و کمک مورد نیاز چیست؛ جزئیات غیرضروری جمع نکنید.","مسیر مستقل موجود و حدود محرمانگی را توضیح دهید؛ اطلاعات را فقط طبق مسئولیت و ضوابط به مرجع مجاز برسانید.","اگر خطر فوری وجود دارد، طبق رویه اضطراری عمل کنید؛ برای موضوع اداری، زمان خبر بعدی را از مسئول رسیدگی روشن بخواهید."],"questions":["چگونه حمایت می‌کنید بدون اینکه اختیار فرد را بگیرید؟","چه اطلاعاتی نباید در گروه عمومی نوشته شود؟"]},"operations":{"problem":"خسته‌اید یا وضعیتی نگران‌کننده دیده‌اید، اما فکر می‌کنید اگر بگویید، شما را ضعیف می‌دانند یا مأموریت بعدی را نمی‌دهند. همکار دیگری هم از برخورد نامناسب ناراحت است و جرئت طرح آن را ندارد.","analysis":"نگرانی از واکنش می‌تواند باعث پنهان‌ماندن مسئله شود. بیان به‌موقع خطر به مراقبت از خود و دیگران کمک می‌کند. برای گزارش رفتار نامناسب باید مسیر مستقل معرفی‌شده را بشناسید.","lesson":"مشکل را دقیق بگویید و از مسیر درست، پاسخ و پیگیری بخواهید.","note":"خستگی و خطر را برای حفظ ظاهر پنهان نکنید.","solution":["در زمان و محل ایمن، نشانه و وضعیت واقعی را بدون اغراق یا سرزنش گزارش کنید.","در خطر فوری طبق طرح اضطراری سایت عمل کنید؛ اگر نگرانی درباره مسئول مستقیم است از مسیر مستقل تعیین‌شده استفاده کنید.","بپرسید قدم بعدی و زمان خبر چیست؛ اطلاعات حساس همکار را در جمع یا گروه منتشر نکنید."],"questions":["برای گزارش خستگی چه جمله روشنی می‌گویید؟","اگر از واکنش مسئول مستقیم نگران باشید، مسیر مستقل کدام است؟"]}}},{"id":14,"title":"اختیار، مسئولیت و پاسخگویی مدیران","concept":"Decision rights · حقوق تصمیم","evidence":"یک تصمیم معطل را تا مرجع اختیار، بودجه، جانشین و معیار پاسخگویی دنبال کنید؛ حدود ریالی یا زمانی را بدون مصوبه فرض نکنید.","variants":{"managers":{"problem":"مدیر سایت مسئول آماده‌بودن ناوگان شناخته می‌شود، اما برای هر هزینه کوچک باید چند تأیید بگیرد. از طرف دیگر، مدیر دیگری خارج از اختیار قولی به مشتری می‌دهد که منابع آن فراهم نیست. در هر دو حالت، نتیجه و اختیار هم‌تراز نیستند.","analysis":"ابهام در حق تصمیم، دسترسی به منابع و معیار ارزیابی، زمینه انتظار یا تصمیم خودسرانه را ایجاد می‌کند. پیش از قضاوت، تفویض‌نامه موجود و تأییدهای واقعی را بررسی کنید؛ اختیار مالی با صلاحیت تصمیم فنی و ایمنی یکی نیست.","lesson":"مسئولیت باید با اختیار متناسب، قابلیت لازم و review نتیجه همراه شود.","note":"پاسخگویی مشترک، صاحب تصمیم نهایی را حذف نمی‌کند.","solution":["مدیران با مرجع صاحب اختیار، در هفته اول سه تصمیم پرتکرار را به «مجاز، نیازمند مشورت، نیازمند تأیید» تفکیک کنند.","حدود مالی و ریسک، جانشین و موارد غیرقابل واگذاری را طبق مصوبه موجود روشن کنند؛ این آموزش خود مجوز ایجاد نمی‌کند.","پس از دو هفته، زمان انتظار، تصمیم خارج از اختیار و کیفیت نتیجه را مرور کنند؛ اصلاح اختیار فقط از مسیر رسمی انجام شود."],"questions":["کدام نتیجه از شما خواسته می‌شود که ابزار تصمیم آن را ندارید؟","چه مرزی باید حتی با تفویض اختیار روشن و ثابت بماند؟"]},"hq":{"problem":"سایت از شما می‌خواهد یک هزینه یا تغییر برنامه را تأیید کنید. قبلاً چنین کارهایی را هماهنگ کرده‌اید، اما روشن نیست اختیار تأیید هم دارید یا فقط مسئول پیگیری هستید. نمی‌خواهید کار متوقف بماند یا تعهد بدون مجوز ایجاد شود.","analysis":"هماهنگ‌کننده، تصمیم‌گیر و تأییدکننده سه نقش متفاوت‌اند. سابقه انجام کار، به‌تنهایی اختیار تازه ایجاد نمی‌کند. روشن‌کردن حق تصمیم از رفت‌وبرگشت و انتقال مسئولیت جلوگیری می‌کند.","lesson":"Take ownership یعنی پیگیری روشن در حدود اختیار، همراه با ارجاع دقیق تصمیم لازم.","note":"پیگیری فعال با قول خارج از اختیار فرق دارد.","solution":["به تفویض اختیار و رویه موجود مراجعه کنید و از سرپرست مرز نقش خود را روشن بخواهید.","در ارجاع بنویسید موضوع، گزینه‌های ممکن، اثر انتظار و تصمیم مورد نیاز چیست؛ مرجع مجاز و جانشین را مشخص کنید.","پس از تأیید، نتیجه و شروط را به سایت برسانید؛ پایان هفته تصمیم‌های معطل را برای روشن‌شدن یک قاعده تکراری مرور کنید."],"questions":["در این درخواست، شما مسئول هماهنگی هستید یا مجاز به تصمیم؟","برای گرفتن تصمیم سریع، چه اطلاعاتی باید آماده کنید؟"]},"operations":{"problem":"در مسیر کار، وضعیت با برنامه فرق کرده است. می‌توانید بخشی از کار عادی را طبق آموزش انجام دهید، اما تغییر مقصد یا دستکاری فنی خارج از اختیار شماست. نگرانید پرسیدن، نشانه ناتوانی تلقی شود.","analysis":"باید مرز کار مجاز، نیاز به تأیید و خطر فوری روشن باشد. استقلال در کار به معنای حدس‌زدن درباره تصمیم خارج از صلاحیت نیست؛ از طرفی هر کار عادی هم نباید بی‌دلیل معطل بماند.","lesson":"حدود اختیار خود را بشناسید و موضوع خارج از آن را روشن ارجاع دهید.","note":"برای نشان‌دادن توانایی، ریسک خارج از صلاحیت نپذیرید.","solution":["پیش از مأموریت بپرسید چه تغییرهایی نیازمند تأیید است و جانشین مسئول کیست.","وقتی شرایط عوض شد، موضوع و گزینه‌های موجود را در توقف ایمن گزارش و تعیین تکلیف بخواهید.","دستور تأییدشده را بازگو کنید و مطابق آن پیش بروید؛ در تحویل شیفت هر تصمیم باز را مشخص کنید."],"questions":["کدام تغییر در اختیار شماست و کدام به تأیید نیاز دارد؟","اگر مسئول اصلی پاسخ ندهد چه می‌کنید؟"]}}},{"id":15,"title":"یک کار، دو تیم؛ مسئول واقعی کیست؟","concept":"Handoff & ownership · تحویل و مالکیت","evidence":"یک کار چندواحدی را از درخواست تا پذیرش خروجی دنبال کنید؛ در هر تحویل مشخص کنید چه چیزی، به چه کسی و با چه تأییدی منتقل شده است.","variants":{"managers":{"problem":"تعمیرات اعلام می‌کند کار خودرو تمام شده است؛ عملیات تصور می‌کند مجوز آماده‌به‌کاری هم صادر شده و ستاد زمان مأموریت را قطعی می‌کند. بعد معلوم می‌شود یک تأیید و هماهنگی مقصد باقی مانده است. هر تیم پایان کار خودش را پایان کل فرایند دانسته است.","analysis":"مرز خروجی واحدها با خروجی نهایی مشترک یکی نیست و معیار پذیرش handoff روشن نشده است. یک مسئول هماهنگی نهایی لازم است، اما تأییدهای تخصصی همچنان با مراجع صلاحیت‌دار می‌مانند. ریشه را در نقطه انتقال بررسی کنید.","lesson":"کار چندتیمی به یک owner نهایی و چند مسئول مرحله‌ای با تحویل روشن نیاز دارد.","note":"مالک نهایی هماهنگ می‌کند؛ جای متخصص، تأیید فنی صادر نمی‌کند.","solution":["مدیر مربوط در هفته اول برای یک فرایند، owner نهایی و مسئول هر مرحله را تعیین کند.","برای هر تحویل، ورودی لازم، خروجی قابل قبول، گیرنده و تأیید دریافت را مشخص کنید؛ آماده‌به‌کاری با تأییدهای مجاز احراز شود.","بعد از یک هفته، تحویل‌های برگشتی و کارهای معطل بین دو واحد را مرور کنید؛ پایان فرایند را با پذیرش نتیجه توسط گیرنده بسنجید."],"questions":["در این سناریو، پایان تعمیر با پایان فرایند چه تفاوتی دارد؟","owner نهایی چگونه بدون گرفتن اختیار تخصصی دیگران پاسخگو می‌ماند؟"]},"hq":{"problem":"اسناد را برای همکار واحد دیگر می‌فرستید و کار را انجام‌شده علامت می‌زنید. او پیام را ندیده یا یک مدرک کم دارد. سایت منتظر نتیجه است و هر دو واحد می‌گویند نوبت طرف دیگر بوده است.","analysis":"ارسال با تحویل پذیرفته‌شده اشتباه شده است. گیرنده، معیار کامل‌بودن و مسئول پیگیری نتیجه نهایی معلوم نیست. اگر پیام خوانده نشود، حلقه کار هنوز باز است.","lesson":"Handoff زمانی کامل است که گیرنده، اطلاعات کافی و مسئولیت قدم بعدی را بپذیرد.","note":"«فرستادم» همیشه به معنای «تحویل شد» نیست.","solution":["هنگام تحویل، خروجی، کار باقی‌مانده، گیرنده مشخص و موعد قدم بعدی را بنویسید.","تأیید دریافت و کامل‌بودن را بگیرید؛ نقص را مشخص و مسئول رفع آن را روشن کنید.","تا تحویل پذیرفته نشود، وضعیت را بسته نزنید؛ پایان هفته موارد برگشت بین دو واحد را با سرپرست مرور کنید."],"questions":["چه پاسخی نشان می‌دهد تحویل واقعاً پذیرفته شده است؟","اگر گیرنده پاسخ نداد، پیگیری بعدی چگونه است؟"]},"operations":{"problem":"شیفت شما تمام شده و خودرو یا کار نیمه‌تمام را به گروه بعد می‌دهید. می‌گویید: «همه چیز را به دفتر گفته‌ام.» گروه بعد نمی‌داند چه کاری باقی مانده و کدام وضعیت هنوز نیاز به تعیین تکلیف دارد.","analysis":"خبر دادن به نفر سوم، جای تحویل مستقیم و روشن را نمی‌گیرد. اگر کار باقی‌مانده و وضعیت مجاز استفاده مشخص نباشد، هم دوباره‌کاری و هم خطر ایجاد می‌شود.","lesson":"تحویل خوب یعنی نفر بعد بداند چه شده، چه مانده و از چه کسی باید پیگیری کند.","note":"چیز نامعلوم را آماده یا انجام‌شده اعلام نکنید.","solution":["طبق رویه تحویل شیفت، وضعیت کار، نقص‌های گزارش‌شده و اقدام‌های باز را به گیرنده مشخص بگویید.","از همکار بخواهید نکات مهم را بازگو کند و از دریافت اطلاعات مطمئن شوید.","اگر گیرنده یا تأیید لازم حاضر نیست، مسئول شیفت را مطلع کنید تا کار بی‌صاحب نماند؛ در مرور بعدی ابهام تحویل را بررسی کنید."],"questions":["در تحویل شیفت چه سه چیز را می‌گویید؟","اگر نفر بعدی هنوز نرسیده، چه کسی باید تعیین تکلیف کند؟"]}}}];
var ROLES={hq:{title:'کارکنان ستاد',focus:'همکاری بین‌واحدی، ارتباط روشن و پیگیری تا نتیجه'},managers:{title:'مدیران ستاد',focus:'تصمیم‌گیری، الگوی رفتاری و پاسخگویی'},operations:{title:'کارکنان عملیاتی',focus:'رفتار روشن و قابل اجرا در شیفت، مسیر و سایت'}};
var GROUPS=['رشد، رسمیت و حرفه‌ای‌گری','همکاری، تصمیم‌گیری و عملیات','مدیریت، منابع انسانی و پاسخگویی'];
var STEPS=['صورت مسئله','تحلیل / ریشه','درس مدیریتی','نکته کلیدی','راه‌حل / اقدام پیشنهادی','سؤال بحث کلاسی'];
